     * SUPABASE BACKEND CLIENT (developer opt-in)
     * Reads project URL + anon key from Settings (state.settings).
     * Enabled only when "Supabase Database" is ON in Settings.
     * Used as a fallback backend when Apps Script (google.script.run) is unavailable.
     ********************************************************************/
    function getSupabaseApiUrl() {
        return (state.settings && state.settings.supabaseUrl) || '';
    }
    function getSupabaseAnonKey() {
        return (state.settings && state.settings.supabaseKey) || '';
    }
    async function supabaseFetch(path, options) {
        const base = getSupabaseApiUrl();
        const key = getSupabaseAnonKey();
        if (!base) throw new Error('Supabase Project URL not set in Settings.');
        if (!key) throw new Error('Supabase Anon Key not set in Settings.');
        if (!state.settings || state.settings.supabaseEnabled !== true) {
            throw new Error('Supabase Database is disabled in Settings.');
        }
        const normalizedBase = base.replace(/\/+$/, '');
        const apiBase = /\/rest\/v1$/i.test(normalizedBase)
            ? normalizedBase
            : normalizedBase + '/rest/v1';
        const url = apiBase + '/' + path.replace(/^\/+/, '');
        const headers = {
            apikey: key,
            Authorization: 'Bearer ' + key,
            'Content-Type': 'application/json',
            ...(options && options.headers ? options.headers : {})
        };
        return fetch(url, { ...options, headers });
    }

    function supabaseStableFingerprint(value) {
        const text = JSON.stringify(value == null ? null : value);
        let hash = 2166136261;
        for (let i = 0; i < text.length; i++) {
            hash ^= text.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
        }
        return text.length + ':' + (hash >>> 0).toString(16);
    }

    function getSupabaseSyncSnapshot() {
        try { return JSON.parse(localStorage.getItem(getSupabaseSyncSnapshotKey()) || '{}'); }
        catch (e) { return {}; }
    }

    function getSupabaseSyncSnapshotKey() {
        return 'DIVINE_SUPABASE_SYNC_SNAPSHOT_' + supabaseStableFingerprint(getSupabaseApiUrl());
    }

    function rememberSupabaseSyncSnapshot() {
        const snapshot = {};
        ['batches', 'students', 'teachers', 'materials', 'offlineTests'].forEach(function (key) {
            snapshot[key] = {};
            (state[key] || []).forEach(function (record) {
                if (record && (record.id != null || record.roll != null)) {
                    const idKey = String(record.id || record.roll);
                    snapshot[key][idKey] = supabaseStableFingerprint(record);
                }
            });
        });
        try { localStorage.setItem(getSupabaseSyncSnapshotKey(), JSON.stringify(snapshot)); }
        catch (e) { }
    }

    /**
     * Transform a raw Supabase row (snake_case) into the app's camelCase format.
     */
    function supabaseRowToAppFormat(row, tableConfig) {
        if (!row || typeof row !== 'object') return row;
        const out = {};
        const colMap = tableConfig.columns || {};

        for (const rawKey of Object.keys(row)) {
            const targetKey = colMap[rawKey] || rawKey;
            if (SUPABASE_META_COLS.includes(rawKey) && !colMap[rawKey]) continue;
            out[targetKey] = row[rawKey];
        }

        // Normalization guarantees so frontend never displays "undefined"
        if (tableConfig.stateKey === 'batches') {
            out.id = out.id || row.batch_id || row.id || '';
            out.name = out.name || row.batch_name || row.name || 'Batch ' + out.id;
            out.room = out.room || row.classroom_hall || row.room || 'Lecture Hall 101';
            out.subject = out.subject || row.subjects || row.subject || 'All Subjects';
            out.teacher = out.teacher || row.lead_faculty || row.teacher || 'Faculty';
            out.schedule = out.schedule || row.schedule || 'Regular Schedule';
            out.teacherId = out.teacherId || row.teacher_id || row.teacherId || null;
            out.teacherEmail = out.teacherEmail || row.teacher_email || row.teacherEmail || null;
            if (!out.teacherId) {
                if (out.id === 'b1' || /rajesh/i.test(out.teacher)) {
                    out.teacherId = 'tr1';
                    out.teacherEmail = out.teacherEmail || 'rajesh.chahar@divineclasses.in';
                } else if (out.id === 'b2' || /sunita/i.test(out.teacher)) {
                    out.teacherId = 'tr2';
                    out.teacherEmail = out.teacherEmail || 'dr.sunita@divineclasses.in';
                } else if (out.id === 'b3' || /arvind/i.test(out.teacher)) {
                    out.teacherId = 'tr3';
                    out.teacherEmail = out.teacherEmail || 'arvind.verma@divineclasses.in';
                }
            }
            if (!Array.isArray(out.studentIds) || !out.studentIds.length) {
                if (out.id === 'b1') out.studentIds = ['DC-101', 'DC-102', 'DC-103', 'DC-104', 'DC-105'];
                else if (out.id === 'b2') out.studentIds = ['DC-106', 'DC-107', 'DC-108'];
                else if (out.id === 'b3') out.studentIds = ['DC-109', 'DC-110', 'DC-111'];
                else out.studentIds = [];
            }
        }
        if (tableConfig.stateKey === 'students') {
            out.id = out.id || row.roll_no || row.id || row.roll || '';
            out.roll = out.roll || row.roll_no || row.roll || out.id;
            out.name = out.name || row.student_name || row.name || 'Student';
            out.password = out.password || row.login_password || row.password || 'password123';
            out.status = out.status || row.access_status || row.status || 'Active';
            out.phone = out.phone || row.contact_phone || row.phone || '';
            out.parentName = out.parentName || row.parent_name || row.parentName || '';
            out.totalFee = Number(out.totalFee !== undefined ? out.totalFee : (row.total_fee_inr !== undefined ? row.total_fee_inr : (row.total_fee || 48000)));
            out.paidFee = Number(out.paidFee !== undefined ? out.paidFee : (row.paid_fee_inr !== undefined ? row.paid_fee_inr : (row.paid_fee || 0)));
            out.monthlyFee = Number(out.monthlyFee !== undefined ? out.monthlyFee : (row.monthly_fee_inr !== undefined ? row.monthly_fee_inr : (row.monthly_fee || 0)));
            out.dueDate = out.dueDate || row.fee_due_date || row.due_date || 'Fully Paid';
            out.lastReminder = out.lastReminder || row.last_reminder_sent || row.last_reminder || '-';
            out.admissionDate = out.admissionDate || row.admission_date || '';
            out.batchId = out.batchId || (['DC-101','DC-102','DC-103','DC-104','DC-105'].includes(out.roll) ? 'b1' : (['DC-106','DC-107','DC-108'].includes(out.roll) ? 'b2' : 'b3'));
        }
        if (tableConfig.stateKey === 'teachers') {
            out.id = out.id || row.teacher_id || row.id || '';
            out.name = out.name || row.teacher_name || row.name || 'Teacher';
            out.email = out.email || row.login_email || row.email || '';
            out.password = out.password || row.login_password || row.password || 'teacher123';
            out.status = out.status || row.access_status || row.status || 'Active';
            out.phone = out.phone || row.contact_phone || row.phone || '';
            out.subject = out.subject || row.primary_subject || row.subject || 'Faculty Mentor';
            out.qualification = out.qualification || row.academic_qualifications || row.qualification || 'M.Sc., B.Ed.';
            out.experience = out.experience || row.teaching_experience || row.experience || '5+ Years';
            out.specialization = out.specialization || row.specialization_focus || row.specialization || 'IIT-JEE / NEET Specialist';
            out.bio = out.bio || row.faculty_biography || row.bio || 'Dedicated faculty mentor at Divine Classes.';
            out.photo = out.photo || row.profile_photo || row.photo || '';
            out.avatarColor = out.avatarColor || row.avatar_color || row.avatarColor || 'bg-slate-600';
            out.initials = out.initials || (out.name ? out.name.split(' ').map(function(n) { return n[0]; }).join('').slice(0, 2).toUpperCase() : 'FC');
        }
        if (tableConfig.stateKey === 'offlineTests') {
            out.id = out.id || row.test_id || row.id || '';
            out.title = out.title || row.test_title || row.name || row.title || 'Offline Test';
            out.batchId = out.batchId || row.batch_id || row.batchId || 'b1';
            out.date = out.date || row.test_date || row.date || '';
            out.subject = out.subject || row.subject || 'Physics';
            out.maxMarks = Number(out.maxMarks !== undefined ? out.maxMarks : (row.max_marks || 100));
            out.marks = (out.marks && typeof out.marks === 'object') ? out.marks : (row.marks || {});
        }
        if (tableConfig.stateKey === 'feedbacks') {
            out.id = out.id || row.id || ('f' + Math.random().toString(36).substr(2, 6));
            out.authorName = out.authorName || row.name || row.author_name || row.student_name || 'Parent / Student';
            out.comment = out.comment || row.message || row.comment || row.feedback_comment || '';
            out.rating = Number(out.rating !== undefined ? out.rating : (row.rating || 5));
            out.batchName = out.batchName || row.batch || row.batch_name || 'JEE Advanced Target 2027';
            out.date = out.date || row.created_at || row.date || '13 Oct 2026';
            out.role = out.role || row.role || ((out.authorName && /parent/i.test(out.authorName)) ? 'Parent' : 'Student');
            out.category = out.category || row.category || row.topic || 'Teaching Quality';
        }

        return out;
    }

    function supabaseSafeSnapshot(data) {
        const snapshot = JSON.parse(JSON.stringify(data || {}));
        if (snapshot.settings) {
            ['adminPassword', 'leadDevPassword', 'devPassword', 'supabaseKey', '_lastAppliedRemoteUpdatedAt'].forEach(function (key) {
                delete snapshot.settings[key];
            });
        }
        return snapshot;
    }

    function isDummySeedRecord(rec) {
        if (!rec) return false;
        const name = String(rec.name || rec.title || '');
        return (rec.isDummy === true && (name.startsWith('[DEMO]') || name.startsWith('Demo '))) ||
            name.startsWith('[DEMO]') || name.startsWith('Demo ');
    }

    /**
     * Persist pending edits directly to Supabase
     */
    async function syncPendingDataToSupabase() {
        if (!state.settings || state.settings.supabaseEnabled !== true) return { synced: false };

        // An older open tab must not reinsert demo rows after they were wiped.
        const snapshotResponse = await supabaseFetch('db_json?snapshot_key=eq.main&select=payload');
        if (!snapshotResponse.ok) {
            throw new Error('Could not verify the Supabase demo-data state before syncing.');
        }
        const snapshotRows = await snapshotResponse.json();
        const savedSettings = snapshotRows[0] && snapshotRows[0].payload && snapshotRows[0].payload.settings;
        const savedClearEpoch = String(savedSettings && savedSettings._applicationDataClearEpoch || '');
        const localClearEpoch = String(state.settings && state.settings._applicationDataClearEpoch || '');
        if (savedClearEpoch && savedClearEpoch !== localClearEpoch) {
            const savedPayload = snapshotRows[0].payload;
            if (typeof crossDeviceApplyRemotePayload === 'function') {
                crossDeviceApplyRemotePayload(savedPayload);
            } else {
                state = Object.assign(state, savedPayload);
                state.settings = Object.assign({}, state.settings, savedSettings);
                saveStateLocally(true, true);
            }
            localStorage.removeItem(PENDING_SYNC_KEY);
            return { synced: false, reason: 'application-data-was-cleared' };
        }
        if (savedSettings && (savedSettings.dummyDataWiped === true || savedSettings.dummyDataWiped === 'true')) {
            if (!state.settings) state.settings = {};
            state.settings.dummyDataWiped = true;
            state.settings.showDummyData = false;

            const dummyStudentIds = {};
            const dummyMaterialIds = {};
            ['students', 'materials'].forEach(function (table) {
                const kept = (state[table] || []).filter(function (record) {
                    if (!record || !isDummySeedRecord(record)) return true;
                    if (table === 'students') dummyStudentIds[String(record.id)] = true;
                    if (table === 'materials') dummyMaterialIds[String(record.id)] = true;
                    return false;
                });
                if (kept.length > 0 || (state[table] || []).length === 0) {
                    state[table] = kept;
                }
            });
            ['batches', 'offlineTests', 'teachers', 'gallery', 'feedbacks'].forEach(function (table) {
                const kept = (state[table] || []).filter(function (record) {
                    return !isDummySeedRecord(record);
                });
                if (kept.length > 0 || (state[table] || []).length === 0) {
                    state[table] = kept;
                }
            });
            (state.batches || []).forEach(function (batch) {
                if (Array.isArray(batch.studentIds)) {
                    batch.studentIds = batch.studentIds.filter(function (id) { return !dummyStudentIds[String(id)]; });
                }
            });
            (state.offlineTests || []).forEach(function (test) {
                if (!test.marks || typeof test.marks !== 'object') return;
                Object.keys(dummyStudentIds).forEach(function (id) { delete test.marks[id]; });
            });
            state.notifications = (state.notifications || []).filter(function (notification) {
                if (!notification) return false;
                const notificationId = String(notification.id || '');
                return !isDummySeedRecord(notification) &&
                    !dummyStudentIds[String(notification.targetStudentId || notification.studentId || '')] &&
                    !dummyMaterialIds[String(notification.materialId || '')] &&
                    !Object.keys(dummyStudentIds).some(function (id) {
                        return notificationId.indexOf('notif_fee_' + id + '_') === 0 ||
                            notificationId.indexOf('monthly_fee_' + id + '_') === 0;
                    }) &&
                    !Object.keys(dummyMaterialIds).some(function (id) {
                        return notificationId.indexOf('notif_mat_' + id) === 0;
                    });
            });
            if (typeof saveStateLocally === 'function') saveStateLocally();
        }

        // 1. Sync full state snapshot to db_json table (instantly persists all edits)
        try {
            await supabaseFetch('db_json?snapshot_key=eq.main', {
                method: 'PATCH',
                headers: { Prefer: 'return=minimal' },
                body: JSON.stringify({
                    payload: supabaseSafeSnapshot(state),
                    updated_at: new Date().toISOString()
                })
            });
        } catch (dbJsonErr) {
            console.warn('[Supabase] db_json update notice:', dbJsonErr);
        }

        // 2. Also sync batches and students to their dedicated tables
        const batchesPayload = (state.batches || []).map(function (b) {
            return {
                batch_id: b.id,
                batch_name: b.name,
                subjects: b.subject,
                schedule: b.schedule,
                classroom_hall: b.room,
                lead_faculty: b.teacher,
                student_count: (b.studentIds || []).length
            };
        });
        const studentsPayload = (state.students || []).map(function (s) {
            return {
                roll_no: s.roll || s.id,
                student_name: s.name,
                login_password: s.password || 'password123',
                access_status: s.status || 'Active',
                parent_name: s.parentName || '',
                contact_phone: s.phone || '',
                total_fee_inr: Number(s.totalFee || 0),
                paid_fee_inr: Number(s.paidFee || 0),
                pending_dues_inr: Number((s.totalFee || 0) - (s.paidFee || 0)),
                fee_due_date: s.dueDate || 'Fully Paid',
                last_reminder_sent: s.lastReminder || '-',
                admission_date: s.admissionDate || '',
                monthly_fee_inr: Number(s.monthlyFee || 0)
            };
        });

        // 2. Sync to core tables first, with roster/master fallback
        const standardBatchesPayload = (state.batches || []).map(function (b) {
            return {
                id: b.id,
                name: b.name,
                subject: b.subject,
                schedule: b.schedule,
                room: b.room,
                teacher: b.teacher,
                student_ids: b.studentIds || b.student_ids || []
            };
        });

        const standardStudentsPayload = (state.students || []).map(function (s) {
            return {
                id: s.id || s.roll,
                roll: s.roll || s.id,
                name: s.name,
                phone: s.phone || '',
                parent_name: s.parentName || '',
                total_fee: Number(s.totalFee || 0),
                paid_fee: Number(s.paidFee || 0),
                monthly_fee: Number(s.monthlyFee || 0),
                due_date: s.dueDate || 'Fully Paid',
                last_reminder: s.lastReminder || '-',
                password: s.password || 'password123',
                status: s.status || 'Active',
                admission_date: s.admissionDate || '',
                batch_id: s.batchId || '',
                photo: s.photo || ''
            };
        });

        try {
            const bRes = await supabaseFetch('batches?on_conflict=id', {
                method: 'POST',
                headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                body: JSON.stringify(standardBatchesPayload)
            });
            if (!bRes.ok) console.warn('[Supabase] batches sync status:', bRes.status, await bRes.text().catch(function(){return ''}));
        } catch (e1) {
            try {
                await supabaseFetch('batches_roster?on_conflict=batch_id', {
                    method: 'POST',
                    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                    body: JSON.stringify(batchesPayload)
                });
            } catch (e2) {
                console.warn('[Supabase] batches fallback error:', e2);
            }
        }

        try {
            const sRes = await supabaseFetch('students?on_conflict=id', {
                method: 'POST',
                headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                body: JSON.stringify(standardStudentsPayload)
            });
            if (!sRes.ok) console.warn('[Supabase] students sync status:', sRes.status, await sRes.text().catch(function(){return ''}));
        } catch (e3) {
            try {
                await supabaseFetch('students_master?on_conflict=roll_no', {
                    method: 'POST',
                    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                    body: JSON.stringify(studentsPayload)
                });
            } catch (e4) {
                console.warn('[Supabase] students fallback error:', e4);
            }
        }

        // 3. Teachers sync
        if (Array.isArray(state.teachers) && state.teachers.length) {
            const teachersPayload = state.teachers.map(function(t) {
                return {
                    id: t.id,
                    name: t.name || '',
                    subject: t.subject || '',
                    qualification: t.qualification || '',
                    experience: t.experience || '',
                    email: t.email || '',
                    phone: t.phone || '',
                    specialization: t.specialization || '',
                    bio: t.bio || '',
                    initials: t.initials || '',
                    password: t.password || 'teacher123',
                    status: t.status || 'Active',
                    photo: t.photo || '',

    /********************************************************************
     * SUPABASE DATA LOADING - Load all tables from Supabase into state
     * Used when Supabase Database is enabled as primary data source.
     ********************************************************************/
    async function supabaseLoadTable(tableName, altTable) {
        let response = await supabaseFetch(tableName + '?select=*');
        if (!response.ok && altTable) {
            response = await supabaseFetch(altTable + '?select=*');
        }
        if (!response.ok) {
            const details = await response.text().catch(function () { return ''; });
            throw new Error('Failed to load ' + tableName + ' (HTTP ' + response.status + ')' + (details ? ': ' + details : ''));
        }
        return await response.json();
    }

    async function loadDataFromSupabase() {
        if (!state.settings || state.settings.supabaseEnabled !== true) return;

        const loadedData = {};
        const loadErrors = [];
        const emptyTables = [];
        for (const tableName of Object.keys(SUPABASE_TABLE_MAP)) {
            try {
                const config = SUPABASE_TABLE_MAP[tableName];
                const rawData = await supabaseLoadTable(tableName, config.altTable);
                if (Array.isArray(rawData)) {
                    // Transform each row from snake_case → camelCase
                    const transformed = rawData.map(function(row) {
                        return supabaseRowToAppFormat(row, config);
                    });
                    const currentRows = Array.isArray(state[config.stateKey]) ? state[config.stateKey] : [];
                    if (transformed.length === 0) {
                        emptyTables.push(tableName);
                        if (!currentRows || currentRows.length === 0) {
                            loadedData[config.stateKey] = [];
                        }
                    } else {
                        loadedData[config.stateKey] = transformed;
                    }
                }
            } catch (e) {
                console.warn('Could not load ' + tableName + ' from Supabase (skipping):', e);
            }
        }

        // Handle settings (support both settings_config and settings key-value tables)
        try {
            let settingsData = null;
            try {
                settingsData = await supabaseLoadTable('settings_config');
            } catch (eConfig) {
                try { settingsData = await supabaseLoadTable('settings'); } catch (eSet) { }
            }
            if (Array.isArray(settingsData)) {
                const settingsKeyMap = {
                    'Institute Name': 'instituteName',
                    'Tagline': 'tagline',
                    'Helpline Phone': 'phone',
                    'Display Contact': 'contactDisplay',
                    'Official Email': 'email',
                    'Address': 'address',
                    'YouTube Channel': 'youtubeUrl',
                    'Admin Name': 'adminName',
                    'Master Admin Password': 'adminPassword',
                    'Admin Email ID': 'adminEmail',
                    'Lead Dev Email': 'leadDevEmail',
                    'Lead Developer Email': 'leadDevEmail',
                    'LEAD_DEV_EMAIL': 'leadDevEmail',
                    'LEAD_DEV_PASSWORD': 'leadDevPassword',
                    'Lead Developer Password': 'leadDevPassword',
                    'UPI Payment ID': 'upiId',
                    'Facebook Page': 'facebookUrl',
                    'Instagram Profile': 'instagramUrl',
                    'Show Demo Login Button': 'demoLoginEnabled',
                    'Chatbot Enabled': 'chatbotEnabled',
                    'Theme Toggle Roles': 'themeToggleRoles',
                    'Theme Menu Button Roles': 'themeMenuButtonRoles',
                    'Guide Button Roles': 'guideButtonRoles',
                    'Role Module Access': 'roleModuleAccess',
                    'Show Requirement Labels': 'showRequirementLabels',
                    'Admin Feedback Delete': 'allowAdminFeedbackDelete',
                    'Study Link Delete': 'allowAdminLinkDelete',
                    'Show Dummy / Demo Data': 'showDummyData',
                    'Dummy Data Wiped': 'dummyDataWiped',
                    'Sheets Mirror Enabled': 'sheetsMirrorEnabled',
                    'Supabase Enabled': 'supabaseEnabled',
                    'Supabase URL': 'supabaseUrl',
                    'institute_name': 'instituteName',
                    'contact_display': 'contactDisplay',
                    'show_requirement_labels': 'showRequirementLabels',
                    'allow_admin_feedback_delete': 'allowAdminFeedbackDelete',
                    'allow_admin_link_delete': 'allowAdminLinkDelete',
                    'show_dummy_data': 'showDummyData',
                    'supabase_enabled': 'supabaseEnabled',
                    'supabase_url': 'supabaseUrl',
                    'supabase_key': 'supabaseKey',
                    'sheets_mirror_enabled': 'sheetsMirrorEnabled',
                    'drive_folder_url': 'driveFolderUrl',
                    'admin_name': 'adminName',
                    'admin_password': 'adminPassword',
                    'admin_email': 'adminEmail',
                    'facebook_url': 'facebookUrl',
                    'instagram_url': 'instagramUrl',
                    'youtube_url': 'youtubeUrl'
                };
                const settingsObj = {};
                settingsData.forEach(function(s) {
                    if (s && s.setting_parameter) {
                        const k = settingsKeyMap[s.setting_parameter] || s.setting_parameter;
                        settingsObj[k] = s.configured_value;
                    } else if (s && s.key) {
                        const mappedKey = settingsKeyMap[s.key] || s.key;
                        settingsObj[mappedKey] = s.value;
                    }
                });
                const boolKeys = ['showRequirementLabels', 'chatbotEnabled', 'demoLoginEnabled', 'allowAdminFeedbackDelete', 'allowAdminLinkDelete', 'showDummyData', 'dummyDataWiped', 'sheetsMirrorEnabled', 'supabaseEnabled'];
                boolKeys.forEach(function(bk) {
                    if (settingsObj[bk] !== undefined) {
                        const str = String(settingsObj[bk]).trim().toLowerCase();
                        settingsObj[bk] = !(str === 'off' || str === 'false' || str === '0' || str === 'no');
                    }
                });
                ['themeToggleRoles', 'themeMenuButtonRoles', 'guideButtonRoles', 'roleModuleAccess'].forEach(function (key) {
                    if (typeof settingsObj[key] === 'string') {
                        try {
                            settingsObj[key] = JSON.parse(settingsObj[key]);
                        } catch (e) {
                            console.warn('[Supabase] Invalid JSON settings value:', key);
                        }
                    }
                });
                loadedData.settings = Object.assign({}, state.settings, settingsObj);
            }
        } catch (e) {
            console.warn('Failed to load settings from Supabase:', e);
        }

        Object.keys(loadedData).forEach(function (key) {
            // Apply loaded data exactly as it is in Supabase, including empty
            // arrays (e.g. batches: [] → "0 Batches" when the DB table is empty).
            if (loadedData[key] !== undefined && loadedData[key] !== null) {
                state[key] = loadedData[key];
            }
        });
        if (!emptyTables.includes('batches') && !emptyTables.includes('students')) {
            rememberSupabaseSyncSnapshot();
        }
        return { emptyTables: emptyTables };
    }

    async function refreshSupabaseTables() {
        if (supabaseTableRefreshInFlight ||
            document.visibilityState === 'hidden' ||
            !state.settings ||
            state.settings.supabaseEnabled !== true ||
            (supabaseSyncTimer && typeof google !== 'undefined' && google.script && google.script.run) ||
            (localStorage.getItem(PENDING_SYNC_KEY) === '1' &&
                typeof google !== 'undefined' && google.script && google.script.run)) {
            return;
        }

        supabaseTableRefreshInFlight = true;
        const before = crossDeviceComparableState(state);
        let beforeObj = {};
        try { beforeObj = JSON.parse(before); } catch (e) {}
        try {
            await loadDataFromSupabase();

            if (before !== crossDeviceComparableState(state)) {
                saveStateLocally(true, true);
                const changedKeys = [];
                const keysToCheck = ['batches', 'students', 'materials', 'offlineTests', 'teachers', 'gallery', 'externalLinks', 'feedbacks', 'notifications', 'attendanceRecords'];
                keysToCheck.forEach(function(k) {
                    if (JSON.stringify(beforeObj[k] || []) !== JSON.stringify(state[k] || [])) changedKeys.push(k);
                });
                if (JSON.stringify(beforeObj.settings || {}) !== JSON.stringify(state.settings || {})) changedKeys.push('settings');

                const isAndroidApp = document.documentElement.classList.contains('android-app');
                if (!isAndroidApp && canBackgroundRerenderMainContent(changedKeys)) {
                    if (typeof updateRoleUI === 'function') updateRoleUI();
                    if (typeof renderSidebar === 'function') renderSidebar();
                    if (typeof renderMainContentPreservingScroll === 'function') {
                        renderMainContentPreservingScroll();
                    } else if (typeof renderMainContent === 'function') {
                        renderMainContent();
                    }
                }
                if (typeof updateNotificationBadge === 'function') updateNotificationBadge();
                updateSyncBadge('✓ Supabase data refreshed', 'success');
            }
        } catch (error) {
            console.warn('[Supabase] Live table refresh failed:', error);
        } finally {
            supabaseTableRefreshInFlight = false;
        }
    }

    async function supabaseClearDummyData(removedIds) {
        if (!state.settings || !state.settings.supabaseUrl || !state.settings.supabaseKey) return { success: false, reason: 'Supabase not configured' };
        const tableAliases = {
            batches: ['batches', 'batches_roster'],
            students: ['students', 'students_master'],
            materials: ['materials', 'materials_repository'],
            offline_tests: ['offline_tests', 'offline_test_marks'],
            teachers: ['teachers', 'teachers_roster'],
            gallery: ['gallery', 'gallery_banners'],
            feedbacks: ['feedbacks', 'feedback_responses']
        };
        const idColumns = {
            batches: ['id', 'batch_id'],
            students: ['id', 'roll_no'],
            materials: ['id', 'material_id'],
            offline_tests: ['id', 'test_id'],
            teachers: ['id', 'teacher_id'],
            gallery: ['id', 'banner_id'],
            feedbacks: ['id', 'row_id']
        };
        const failures = [];
        // CRITICAL: external_links and settings_config are NEVER deleted!
        // IDs come from removedIds (dynamically collected), not hardcoded lists.
        for (const tbl of Object.keys(tableAliases)) {
            const allIds = (removedIds && removedIds[tbl]) || [];
            const uniqueIds = allIds.filter((id, index) => id && allIds.indexOf(id) === index);
            if (!uniqueIds.length) continue;
            let tableAvailable = false;
            const tableFailures = [];
            for (const tableName of tableAliases[tbl] || [tbl]) {
                for (const column of idColumns[tbl] || ['id']) {
                    const filter = uniqueIds.map(id => encodeURIComponent(String(id))).join(',');
                    const response = await supabaseFetch(`${tableName}?${column}=in.(${filter})`, {
                        method: 'DELETE',
                        headers: { 'Prefer': 'return=minimal' }
                    });
                    if (response.ok) tableAvailable = true;
                    else tableFailures.push(`${tableName}.${column}: ${response.status} ${await response.text()}`);
                }
            }
            if (!tableAvailable) {
                failures.push(`${tbl}: ${tableFailures.join('; ')}`);
            }
        }
        const notificationIds = (removedIds && removedIds.notifications) || [];
        if (notificationIds.length) {
            const filter = notificationIds.map(id => encodeURIComponent(String(id))).join(',');
            const notificationResponse = await supabaseFetch(`notifications?id=in.(${filter})`, {
                method: 'DELETE',
                headers: { 'Prefer': 'return=minimal' }
            });
            if (!notificationResponse.ok) {
                failures.push(`notifications: ${notificationResponse.status} ${await notificationResponse.text()}`);
            }
        }
        for (const setting of [
            { parameter: 'Show Dummy / Demo Data', value: 'Off' },
            { parameter: 'Dummy Data Wiped', value: 'Yes' }
        ]) {
            const response = await supabaseFetch(`settings_config?setting_parameter=eq.${encodeURIComponent(setting.parameter)}`, {
                method: 'PATCH',
                headers: { 'Prefer': 'return=minimal' },
                body: JSON.stringify({ configured_value: setting.value })
            });
            if (!response.ok) failures.push(`settings_config (${setting.parameter}): ${response.status} ${await response.text()}`);
        }
        const snapshotResponse = await supabaseFetch('db_json?snapshot_key=eq.main', {
            method: 'PATCH',
            headers: { 'Prefer': 'return=minimal' },
            body: JSON.stringify({ payload: supabaseSafeSnapshot(state), updated_at: new Date().toISOString() })
        });
        if (!snapshotResponse.ok) failures.push(`db_json snapshot: ${snapshotResponse.status} ${await snapshotResponse.text()}`);
        if (failures.length) throw new Error(`Supabase dummy-data cleanup failed: ${failures.join('; ')}`);
        return { success: true };
    }

        try {
            const rawData = await supabaseLoadTable('settings_config');
            if (!Array.isArray(rawData) || rawData.length === 0) return;
            const settingsKeyMap = {
                'Institute Name': 'instituteName',
                'Tagline': 'tagline',
                'Helpline Phone': 'phone',
                'Display Contact': 'contactDisplay',
                'Official Email': 'email',
                'Address': 'address',
                'YouTube Channel': 'youtubeUrl',
                'Admin Name': 'adminName',
                'Admin Email ID': 'adminEmail',
                'Lead Dev Email': 'leadDevEmail',
                'Lead Developer Email': 'leadDevEmail',
                'LEAD_DEV_EMAIL': 'leadDevEmail',
                'UPI Payment ID': 'upiId',
                'Facebook Page': 'facebookUrl',
                'Instagram Profile': 'instagramUrl',
                'Show Demo Login Button': 'demoLoginEnabled',
                'Chatbot Enabled': 'chatbotEnabled',
                'Theme Toggle Roles': 'themeToggleRoles',
                'Theme Menu Button Roles': 'themeMenuButtonRoles',
                'Guide Button Roles': 'guideButtonRoles',
                'Role Module Access': 'roleModuleAccess',
                'Show Requirement Labels': 'showRequirementLabels',
                'Admin Feedback Delete': 'allowAdminFeedbackDelete',
                'Study Link Delete': 'allowAdminLinkDelete',
                'Show Dummy / Demo Data': 'showDummyData',
                'Dummy Data Wiped': 'dummyDataWiped',
                'Sheets Mirror Enabled': 'sheetsMirrorEnabled',
                'Supabase Enabled': 'supabaseEnabled',
                'Supabase URL': 'supabaseUrl'
            };
            const boolKeys = ['showRequirementLabels', 'chatbotEnabled', 'demoLoginEnabled', 'allowAdminFeedbackDelete', 'allowAdminLinkDelete', 'showDummyData', 'dummyDataWiped', 'sheetsMirrorEnabled', 'supabaseEnabled'];
            let changed = false;
            rawData.forEach(function(item) {
                if (!item || !item.setting_parameter) return;
                const k = settingsKeyMap[item.setting_parameter];
                if (!k) return;
                let val = item.configured_value;
                if (boolKeys.indexOf(k) !== -1) {
                    const str = String(val).trim().toLowerCase();
                    val = !(str === 'off' || str === 'false' || str === '0' || str === 'no');
                } else if (['themeToggleRoles', 'themeMenuButtonRoles', 'guideButtonRoles', 'roleModuleAccess'].indexOf(k) !== -1) {
                    try {
                        val = JSON.parse(val);
                    } catch (e) {
                        console.warn('[Supabase] Invalid JSON settings value:', k);
                        return;
                    }
                }
                if (JSON.stringify(state.settings[k]) !== JSON.stringify(val)) {
                    state.settings[k] = val;
                    changed = true;
                }
            });
            if (changed) {
                saveStateLocally(true, true);
                if (typeof savePersistentSettingsToLocal === 'function') {
                    savePersistentSettingsToLocal();
                }
                const changedKeys = [];
                const keysToCheck = ['batches', 'students', 'materials', 'offlineTests', 'teachers', 'gallery', 'externalLinks', 'feedbacks', 'notifications', 'attendanceRecords'];
                keysToCheck.forEach(function(k) {
                    if (JSON.stringify(beforeObj[k] || []) !== JSON.stringify(state[k] || [])) changedKeys.push(k);
                });
                if (JSON.stringify(beforeObj.settings || {}) !== JSON.stringify(state.settings || {})) changedKeys.push('settings');

                const isAndroidApp = document.documentElement.classList.contains('android-app');
                if (!isAndroidApp && canBackgroundRerenderMainContent(changedKeys)) {
                    if (typeof updateRoleUI === 'function') updateRoleUI();
                    if (typeof renderSidebar === 'function') renderSidebar();
                    if (typeof renderMainContentPreservingScroll === 'function') {
                        renderMainContentPreservingScroll();
                    } else if (typeof renderMainContent === 'function') {
                        renderMainContent();
                    }
                }
            }
        } catch (e) {
            console.warn('[Supabase] Background settings sync failed:', e);
        } finally {
            supabaseSettingsPollInFlight = false;
        }
    }

    /********************************************************************
     * CROSS-DEVICE REAL-TIME SYNC
     * When settings/data are applied on one device (laptop web app), every
     * other running device (mobile APK, other laptops, up to 150 students)
     * sees the change within seconds without a manual refresh.
     *
     * Mechanism:
     *   1. Every successful sync writes db_json with a fresh `updated_at`.
     *   2. Each device polls only `updated_at` (lightweight) every 5s.
     *   3. When remote `updated_at` is newer than the local last-applied one,
     *      the device fetches the full payload from Supabase and re-renders.
     *   4. A `storage` event listener gives instant sync between tabs of the
     *      same origin.
     ********************************************************************/
    let crossDeviceSyncTimer = null;
    let crossDeviceLastRemoteUpdatedAt = null;
    let crossDevicePollInFlight = false;

    function crossDeviceGetLocalUpdatedAt() {
        return crossDeviceLastRemoteUpdatedAt || '';
    }

    function crossDeviceComparableState(value) {
        const keys = ['batches', 'students', 'materials', 'offlineTests', 'teachers', 'gallery', 'externalLinks', 'feedbacks', 'notifications'];
        const comparable = {};
        keys.forEach(function (key) {
            comparable[key] = value && Array.isArray(value[key]) ? value[key] : [];
        });
        comparable.settings = supabaseSafeSnapshot({ settings: (value && value.settings) || {} }).settings;
        return JSON.stringify(comparable);
    }

    function crossDeviceApplyRemotePayload(payload) {
        try {
            if (!payload || typeof payload !== 'object') return;
            const beforeComparable = crossDeviceComparableState(state);
            const afterComparable = crossDeviceComparableState(payload);
            if (beforeComparable === afterComparable) return;

            let beforeObj = {};
            try { beforeObj = JSON.parse(beforeComparable); } catch (e) {}

            const session = {
                currentRole: state.currentRole,
                isAuthenticated: state.isAuthenticated,
                activeTab: state.activeTab,
                activeStudentId: state.activeStudentId,
                settings: state.settings || {}
            };
            ['batches', 'students', 'materials', 'offlineTests', 'teachers', 'gallery'].forEach(function(tbl) {
                if (Array.isArray(state[tbl]) && state[tbl].length > 0 && Array.isArray(payload[tbl]) && payload[tbl].length === 0) {
                    payload[tbl] = state[tbl];
                }
            });
            state = Object.assign({}, payload, session);
            state.settings = Object.assign({}, session.settings || {}, payload.settings || {});
            saveStateLocally(true, true);
            if (typeof savePersistentSettingsToLocal === 'function') {
                savePersistentSettingsToLocal();
            }

            const changedKeys = [];
            const keysToCheck = ['batches', 'students', 'materials', 'offlineTests', 'teachers', 'gallery', 'externalLinks', 'feedbacks', 'notifications', 'attendanceRecords'];
            keysToCheck.forEach(function(k) {
                if (JSON.stringify(beforeObj[k] || []) !== JSON.stringify(state[k] || [])) changedKeys.push(k);
            });
            if (JSON.stringify(beforeObj.settings || {}) !== JSON.stringify(state.settings || {})) changedKeys.push('settings');

            if (canBackgroundRerenderMainContent(changedKeys)) {
                if (typeof updateRoleUI === 'function') updateRoleUI();
                if (typeof renderSidebar === 'function') renderSidebar();
                if (typeof renderMainContentPreservingScroll === 'function') {
                    renderMainContentPreservingScroll();
                } else if (typeof renderMainContent === 'function') {
                    renderMainContent();
                }
            }
            if (typeof updateNotificationBadge === 'function') updateNotificationBadge();
            if (typeof updateSyncBadge === 'function') {
                updateSyncBadge('✓ Cloud Synced (multi-device)', 'success');
            }
        } catch (e) {
            console.warn('[Cross-device] Apply remote payload failed:', e);
        }
    }

    async function pollSupabaseSnapshotTimestamp() {
        if (crossDevicePollInFlight || !state.settings || state.settings.supabaseEnabled !== true || !state.settings.supabaseUrl || !state.settings.supabaseKey) return;
        crossDevicePollInFlight = true;
        try {
            // Step 1: lightweight check of only updated_at
            const tsResponse = await supabaseFetch('db_json?snapshot_key=eq.main&select=updated_at');
            if (!tsResponse.ok) return;
            const tsRows = await tsResponse.json();
            if (!Array.isArray(tsRows) || tsRows.length === 0) return;
            const remoteUpdatedAt = tsRows[0] && tsRows[0].updated_at;
            if (!remoteUpdatedAt) return;
            if (!crossDeviceLastRemoteUpdatedAt) {
                crossDeviceLastRemoteUpdatedAt = remoteUpdatedAt;
                return;
            }
            const localUpdatedAt = crossDeviceGetLocalUpdatedAt();
            if (remoteUpdatedAt === localUpdatedAt || remoteUpdatedAt <= localUpdatedAt) return;
            // Step 2: fetch full payload only when it changed
            const payloadResponse = await supabaseFetch('db_json?snapshot_key=eq.main&select=payload');
            if (!payloadResponse.ok) return;
            const payloadRows = await payloadResponse.json();
            if (!Array.isArray(payloadRows) || payloadRows.length === 0) return;
            const remotePayload = payloadRows[0] && payloadRows[0].payload;
            crossDeviceLastRemoteUpdatedAt = remoteUpdatedAt;
            if (remotePayload) crossDeviceApplyRemotePayload(remotePayload);
        } catch (e) {
            console.warn('[Supabase] Background data sync failed:', e);
        } finally {
            crossDevicePollInFlight = false;
        }
    }

    function canBackgroundRerenderMainContent(changedKeys) {
        if (!state || !state.isAuthenticated) return false;
        if (state.activeTab === 'dashboard' || state.activeTab === 'home') return false;
        const activeEl = document.activeElement;
        if (activeEl && activeEl.closest && activeEl.closest('#main-content') && /^(INPUT|TEXTAREA|SELECT)$/.test(activeEl.tagName)) {
            return false;
        }
        // Only re-render if the active tab's underlying data actually changed
        if (Array.isArray(changedKeys) && changedKeys.length > 0) {
            const tabKeyMap = {
                batches: ['batches', 'students'],
                attendance: ['attendanceRecords', 'batches', 'students'],
                fees: ['students', 'batches'],
                materials: ['materials', 'batches'],
                marks: ['offlineTests', 'students', 'batches'],
                teachers: ['teachers'],
                gallery: ['gallery'],
                links: ['externalLinks'],
                feedback: ['feedbacks'],
                settings: ['settings']
            };
            const relevantKeys = tabKeyMap[state.activeTab];
            if (relevantKeys && !relevantKeys.some(function(k) { return changedKeys.includes(k); })) {
                return false;
            }
        }
        return true;
    }

    function startCrossDeviceSync() {
        if (crossDeviceSyncTimer) return;
        crossDeviceSyncTimer = setInterval(pollSupabaseSnapshotTimestamp, 5000);
        pollSupabaseSnapshotTimestamp();
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) pollSupabaseSnapshotTimestamp();
        });
        window.addEventListener('focus', function () {
            pollSupabaseSnapshotTimestamp();
        });
        // Instant tab-to-tab sync within the same origin (laptop tabs)
        window.addEventListener('storage', function (event) {
            if (!event.key) return;
            if (typeof STATE_STORAGE_KEY !== 'undefined' ? event.key !== STATE_STORAGE_KEY : event.key === 'DIVINE_AUTH_SESSION' || event.key === 'DIVINE_SAVED_CREDS' || event.key === 'DIVINE_LAST_ACTIVITY' || event.key === 'DIVINE_COLOR_THEME' || event.key === 'DIVINE_THEME') return;
            if (window._dcStorageDebounce) clearTimeout(window._dcStorageDebounce);
            window._dcStorageDebounce = setTimeout(function () {
                if (document.documentElement.classList.contains('android-app') || !canBackgroundRerenderMainContent()) return;
                if (typeof renderMainContentPreservingScroll === 'function') {
                    renderMainContentPreservingScroll();
                } else if (typeof renderMainContent === 'function') {
                    renderMainContent();
                }
            }, 600);
        });
    }

    function startSupabaseLiveSync() {
        if (supabaseSettingsPollTimer) return;
        supabaseSettingsPollTimer = setInterval(pollSupabaseSettings, 4000);
        pollSupabaseSettings();
        startCrossDeviceSync();
        if (!supabaseTableRefreshTimer) {
            supabaseTableRefreshTimer = setInterval(refreshSupabaseTables, 30000);
        }
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                pollSupabaseSettings();
                refreshSupabaseTables();
            }
        });
        window.addEventListener('focus', function() {
            pollSupabaseSettings();
            refreshSupabaseTables();
        });
    }

</script>
