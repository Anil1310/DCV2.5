plugins {
    id "com.android.application"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace = "com.divineclasses.portal"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.divineclasses.portal"
        minSdk = 26
        targetSdk = 35
        versionCode = 16
        versionName = "V2.6"
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Divine Classes.V2.6.apk"
        }
    }

    signingConfigs {
        release {
            def storeFilePath = localProperties.getProperty('RELEASE_STORE_FILE') ?: project.findProperty('RELEASE_STORE_FILE')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword localProperties.getProperty('RELEASE_STORE_PASSWORD') ?: project.findProperty('RELEASE_STORE_PASSWORD')
                keyAlias localProperties.getProperty('RELEASE_KEY_ALIAS') ?: project.findProperty('RELEASE_KEY_ALIAS')
                keyPassword localProperties.getProperty('RELEASE_KEY_PASSWORD') ?: project.findProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def storeFilePath = localProperties.getProperty('RELEASE_STORE_FILE') ?: project.findProperty('RELEASE_STORE_FILE')
            if (storeFilePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.activity:activity:1.10.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
}
