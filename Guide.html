                <div class="inline-flex rounded-xl p-0.5 sm:p-1 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold flex-wrap">
                    <button type="button" id="guide-tab-admin" onclick="switchGuideManual('admin')" class="px-2 sm:px-2.5 py-1 rounded-lg transition text-[11px] ${role === 'admin' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-xs font-bold' : 'text-slate-600 dark:text-slate-400'}">Admin</button>
                    <button type="button" id="guide-tab-teacher" onclick="switchGuideManual('teacher')" class="px-2 sm:px-2.5 py-1 rounded-lg transition text-[11px] ${role === 'teacher' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-xs font-bold' : 'text-slate-600 dark:text-slate-400'}">Teacher</button>
                    <button type="button" id="guide-tab-student" onclick="switchGuideManual('student')" class="px-2 sm:px-2.5 py-1 rounded-lg transition text-[11px] ${role === 'student' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-xs font-bold' : 'text-slate-600 dark:text-slate-400'}">Student</button>
                    <button type="button" id="guide-tab-developer" onclick="switchGuideManual('developer')" class="px-2 sm:px-2.5 py-1 rounded-lg transition text-[11px] ${role === 'developer' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-xs font-bold' : 'text-slate-600 dark:text-slate-400'}">Dev</button>
                </div>
            `;
        }

        const html = `
            <div class="flex flex-col max-h-[85vh]">
                <div class="flex flex-wrap items-center justify-between pb-3 sm:pb-4 border-b border-slate-100 dark:border-slate-800 gap-2.5 sm:gap-3">
                    <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
                        <span class="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-gradient-to-tr from-sky-500 via-indigo-600 to-purple-600 flex items-center justify-center text-white text-lg shadow-lg shadow-indigo-500/25 shrink-0">
                            <i class="fa-solid fa-book-open"></i>
                        </span>
                        <div class="min-w-0">
                            <h3 class="text-base sm:text-xl font-black bg-gradient-to-r from-sky-600 via-indigo-600 to-purple-600 bg-clip-text text-transparent font-heading leading-tight flex items-center gap-2 truncate">
                                <span>Portal User Guide</span>
                                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black bg-gradient-to-r from-amber-400 to-orange-500 text-white shadow-xs">v2.5</span>
                            </h3>
                            <p id="guide-role-subtitle" class="text-[11px] sm:text-xs font-semibold text-slate-500 dark:text-slate-400 truncate">${getRoleGuideSubtitle(role)}</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-1.5 sm:gap-2">
                        ${roleSwitcherHtml}
                        <button type="button" onclick="printGuideManual()" title="Print / Export Guide" class="w-8 h-8 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 text-slate-600 dark:text-slate-300 flex items-center justify-center transition cursor-pointer">
                            <i class="fa-solid fa-print text-xs"></i>
                        </button>
                        <button type="button" onclick="closeModal()" title="Close Guide" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 hover:text-slate-700 dark:text-slate-400 flex items-center justify-center transition cursor-pointer">
                            <i class="fa-solid fa-xmark text-sm"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-2.5 pb-2 space-y-2 border-b border-slate-100 dark:border-slate-800/80">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" id="guide-search-input" oninput="filterGuideSearch(this.value)" placeholder="Search any topic (e.g. attendance, tests, login, marks, homework)..." class="w-full pl-9 pr-9 py-2 rounded-xl text-xs bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-hidden focus:ring-2 focus:ring-sky-500/30 transition">
                        <button type="button" onclick="clearGuideSearch()" id="guide-clear-search-btn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs">
                            <i class="fa-solid fa-circle-xmark"></i>
                        </button>
                    </div>
                    <div id="guide-tags-container" class="flex items-center gap-1.5 overflow-x-auto pb-1 text-[11px] no-scrollbar">
                        ${renderTagButtons(role)}
                    </div>
                    <div class="flex items-center justify-between gap-2 pt-1 border-t border-slate-100 dark:border-slate-800/60">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider"><i class="fa-solid fa-layer-group text-indigo-500 mr-1"></i>Tap any card to expand / collapse</span>
                        <div class="flex items-center gap-1.5 shrink-0">
                            <button type="button" onclick="toggleAllGuideSections(true)" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 transition flex items-center gap-1 cursor-pointer">
                                <i class="fa-solid fa-angles-down text-[9px] text-indigo-500"></i><span>Expand All</span>
                            </button>
                            <button type="button" onclick="toggleAllGuideSections(false)" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 transition flex items-center gap-1 cursor-pointer">
                                <i class="fa-solid fa-angles-up text-[9px] text-slate-500"></i><span>Collapse All</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="guide-scroll-container" class="mt-3 flex-1 overflow-y-auto pr-1 sm:pr-2 scroll-smooth max-h-[62vh]">
                    <div id="guide-rendered-body">
                        ${window.getGuideHtml(role)}
                    </div>
                    <div id="guide-empty-search" class="hidden py-16 text-center text-slate-400">
                        <i class="fa-solid fa-circle-question text-3xl mb-2 text-slate-300 dark:text-slate-600"></i>
                        <p class="text-sm font-semibold">No matching guide sections found.</p>
                        <p class="text-xs text-slate-400 mt-1">Try another keyword or tap "All" to view the complete guide.</p>
                    </div>
                </div>
            </div>
        `;
        if (typeof openModal === 'function') {
            openModal(html);
        }
    };

    window.switchGuideManual = function(role) {
        window._guideManualType = role;
        ['admin', 'teacher', 'student', 'developer'].forEach(function(r) {
            const btn = document.getElementById('guide-tab-' + r);
            if (btn) {
                if (r === role) {
                    btn.className = 'px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg transition text-[11px] sm:text-xs bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-xs font-bold';
                } else {
                    btn.className = 'px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg transition text-[11px] sm:text-xs text-slate-600 dark:text-slate-400 hover:text-slate-900';
                }
            }
        });

        const sub = document.getElementById('guide-role-subtitle');
        if (sub) sub.textContent = getRoleGuideSubtitle(role);

        const tagsContainer = document.getElementById('guide-tags-container');
        if (tagsContainer) tagsContainer.innerHTML = renderTagButtons(role);

        const body = document.getElementById('guide-rendered-body');
        if (body) {
            body.innerHTML = window.getGuideHtml(role);
        }
        window.clearGuideSearch();
    };

    window.filterGuideSearch = function(query) {
        const clean = (query || '').toLowerCase().trim();
        const clearBtn = document.getElementById('guide-clear-search-btn');
        if (clearBtn) clearBtn.classList.toggle('hidden', !clean);

        const cards = document.querySelectorAll('.guide-card');
        let visibleCount = 0;
        cards.forEach(function(card) {
            const text = (card.textContent || '').toLowerCase();
            const matches = !clean || text.includes(clean);
            card.classList.toggle('hidden', !matches);
            if (matches) {
                visibleCount++;
                if (clean && typeof card.open !== 'undefined') card.open = true;
            }
        });

        const emptyNotice = document.getElementById('guide-empty-search');
        if (emptyNotice) {
            emptyNotice.classList.toggle('hidden', visibleCount > 0);
        }
    };

    window.clearGuideSearch = function() {
        const input = document.getElementById('guide-search-input');
        if (input) {
            input.value = '';
            window.filterGuideSearch('');
        }
    };

    window.filterGuideByTag = function(tag) {
        const input = document.getElementById('guide-search-input');
        if (input) {
            input.value = tag;
            window.filterGuideSearch(tag);
        }
        const tagBtns = document.querySelectorAll('.guide-tag-btn');
        tagBtns.forEach(function(btn) {
            const isActive = (tag === '' && btn.textContent.includes('All')) ||
                (tag !== '' && btn.textContent.toLowerCase().includes(tag));
            if (isActive) {
                btn.className = 'guide-tag-btn px-2.5 py-1 rounded-lg font-semibold bg-sky-600 text-white shadow-2xs whitespace-nowrap cursor-pointer';
            } else {
                btn.className = 'guide-tag-btn px-2.5 py-1 rounded-lg font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 whitespace-nowrap cursor-pointer';
            }
        });
    };

    window.toggleAllGuideSections = function(openState) {
        const details = document.querySelectorAll('.guide-card');
        details.forEach(function(d) {
            if (typeof d.open !== 'undefined') d.open = openState;
        });
    };

    window.scrollGuideTo = function(anchorId) {
        const target = document.getElementById(anchorId);
        const container = document.getElementById('guide-scroll-container');
        if (target && container) {
            if (typeof target.open !== 'undefined') target.open = true;
            const targetTop = target.offsetTop - container.offsetTop - 10;
            container.scrollTo({ top: targetTop, behavior: 'smooth' });
            target.classList.add('ring-2', 'ring-indigo-500', 'ring-offset-2');
            setTimeout(function() {
                target.classList.remove('ring-2', 'ring-indigo-500', 'ring-offset-2');
            }, 1500);
        }
    };

    window.printGuideManual = function() {
        const content = document.getElementById('guide-rendered-body');
        if (!content) return;
        const printWin = window.open('', '_blank');
        if (!printWin) {
            window.print();
            return;
        }
        const fontAwesomeUrl = 'https:' + '//cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css';
        const tailwindUrl = 'https:' + '//cdn.tailwindcss.com';
        printWin.document.write('<!DOCTYPE html><html><head><title>Divine Classes Portal - User Guide</title><link rel="stylesheet" href="' + fontAwesomeUrl + '">' + '<' + 'script src="' + tailwindUrl + '"><' + '/script><style>body { font-family: system-ui, -apple-system, sans-serif; background: #fff; color: #1e293b; padding: 24px; } @media print { .guide-card { break-inside: avoid; } }</style></head><body>' + content.innerHTML + '<' + 'script>setTimeout(function(){ window.print(); }, 500);<' + '/script></body></html>');
        printWin.document.close();
    };
})();
</script>
