**For:** Institute Administrators, Directors & Academic Coordinators  
**Role:** Admin (Full Governance & Management)  
**Version:** 2.5 Cloud Edition  
**Last updated:** November 2026

## 1. Admin Role & Governance Overview

Welcome to the **Divine Classes Administrator Portal**. As an Administrator, you have complete authority over day-to-day coaching institute operations, financial records, student admissions, faculty oversight, and cloud security.

### Core Administrative Responsibilities
- **Admissions & Batches:** Create batches, schedule subjects, enroll students, and issue official ID cards.
- **Attendance Oversight:** Monitor daily student attendance marked by faculty, review monthly registers, and rectify discrepancies.
- **Financial Governance:** Maintain the **Admin Confidential Fee Ledger**, collect payments, record partial installments, and dispatch automated WhatsApp/SMS fee reminders.
- **Access Control & Security:** Authorize user accounts, reset student and teacher passwords, block delinquent accounts, and secure the **Admin Master Password**.
- **Academic Content & Marks:** Oversee DPP uploads, manage offline test series, and generate student report cards.
- **Cloud Database:** Maintain real-time cloud sync with Supabase and Google Sheets.

> The Fee Ledger, Access Control, Master Password, and Institute Settings are strictly hidden from Teachers and Students.

---

## 2. Admin Dashboard & Institute KPIs

The Dashboard acts as your central command center with high-level KPI cards and 1-click operational shortcuts.

### KPI Metric Cards
- **Active Batches:** Total active coaching batches and enrolled student count.
- **Study Uploads:** Total assignments, DPP worksheets, and test papers hosted on Google Drive.
- **Offline Class Tests:** Total evaluated exams conducted this academic cycle.
- **Pending Fees:** Total outstanding dues across all active students with instant collection tracking.

### Quick Actions
- **Create Batch:** Opens the batch setup wizard.
- **Confidential Fee Ledger:** Direct jump to payments and ledger tables.
- **Access Control:** Manage student and teacher logins and passwords.
- **Marks Tracker:** Review recent test performance.

---

## 3. Batch Creation & Scheduling

Batches structure your coaching curriculum by class, target exam, and schedule.

### 3.1 Create a New Batch
1. Open **Batches & Students** from the sidebar or bottom bar.
2. Click **Create New Batch**.
3. Fill in the batch parameters:
   - **Batch Name:** e.g. `Class 11 — JEE Advanced Physics & Maths`
   - **Room / Hall:** e.g. `Hall A (Main Campus)`
   - **Schedule & Timings:** e.g. `Mon, Wed, Fri • 4:00 PM – 7:00 PM`
   - **Subjects:** e.g. `Physics, Mathematics`
   - **Faculty Mentor:** Select assigned teacher from the dropdown.
4. Click **Create Batch**. The batch is immediately created and synced to the cloud.

### 3.2 Managing Batch Rosters
- Open any batch card to see all currently enrolled students, their roll numbers, and contact details.
- Use **View Batch Materials →** to inspect uploaded DPPs for that specific batch.

---

## 4. Student Admissions, Rosters & ID Cards

Manage student registrations from inquiry to graduation.

### 4.1 Enrolling a Brand-New Student
1. Open **Batches & Students**.
2. Click **Add Student** on the batch card, then select **Enroll Brand New Student**.
3. Fill in the student record:
   - **Full Name:** Student's legal name.
   - **Roll Number:** Unique identifier (e.g. `DC-101`).
   - **Parent / Guardian Name:** For communications.
   - **Phone / WhatsApp:** Parent contact number for attendance alerts and fee reminders.
   - **Target Batch:** Assigned class/batch.
   - **Monthly Fee / Total Course Fee:** Fee obligation.
   - **Fee Due Date:** Monthly billing cycle date.
   - **Photo:** (Optional) Upload student avatar or passport photo.
4. Click **Save Student**. The student is automatically enrolled and given login credentials (`password123`).

### 4.2 Generating Official Student ID Cards
1. Locate the student in **Batches & Students** or the Fee Ledger.
2. Click **Student ID Card**.
3. A print-ready digital identity card is generated with institute branding, roll number, batch, parent phone, and photo.
4. Tap **Print ID Card** or save as PDF to hand over to the student.

---

## 5. Institute Attendance Management

Admin has full view and editing permissions over institute-wide attendance.

### 5.1 Marking Daily Batch Attendance
1. Open **Attendance**.
2. Select the **Month**, **Date**, and **Batch**.
3. For each student, mark:
   - **Present** (Green)
   - **Absent** (Red)
   - **Late** (Amber)
4. Click **Save attendance** to commit records to the database.

### 5.2 Reviewing Monthly Registers
- Scroll down to the **Monthly Register** table below the marking grid.
- View the entire month's attendance matrix for the batch.
- Click **Edit** next to any student to unlock and correct past attendance entries.

---

## 6. Confidential Fee Ledger & Payments

The Fee Ledger is strictly confidential and visible only to Administrators.

### 6.1 Financial Summary Cards
- **Monthly Expected Fees:** Total monthly revenue expected from enrolled students.
- **Total Fees Collected:** Cumulative revenue received to date.
- **Fee Due Students:** Number of students with outstanding dues.
- **Collection Health:** Percentage of students whose payments are up to date.

### 6.2 Recording Fee Payments
1. Open **Student Fees & Reminders**.
2. Locate the student using the search bar (filter by name, roll number, or mobile).
3. Click the **Record Payment** action.
4. Enter the amount received, payment mode (Cash, UPI, Cheque, Bank Transfer), and optional transaction note.
5. Click **Confirm Payment**. The student's balance updates in real time, and their dashboard reflects the new payment status.

### 6.3 Exporting Fees to CSV
- Click **Export to CSV** at the top of the Fee Ledger.
- Downloads a clean spreadsheet containing student names, roll numbers, fees, paid amounts, due balances, and parent phones for offline accounting audits.

---

## 7. WhatsApp & SMS Fee Reminders

Quickly notify parents regarding overdue fees with zero manual typing.

### 7.1 Single Student Reminder
- Click the **bell / reminder icon** next to any student with pending dues.
- Instantly sends an in-app alert to the student's dashboard and prepares a WhatsApp/SMS alert for the parent.

### 7.2 Send Bulk Reminders (N)
- When multiple students have pending balances, a prominent orange button appears: **Send Bulk Reminders (N)**.
- Tap this button once to dispatch reminder alerts to all students with overdue fees simultaneously.

---

## 8. Access Control & Password Management

Safeguard institute integrity with centralized credential management.

### 8.1 Students Account Control
- **Search & Filter:** Find students by roll number, name, or batch.
- **Authorize All:** Instantly activates all newly registered students in one tap.
- **Reset to Default:** Sets student password back to `password123` if they forgot it.
- **Block / Unblock:** Temporarily lock accounts of suspended or fee-defaulting students. Blocked users cannot sign in and are shown an administrative contact notice.

### 8.2 Teachers Account Control
- View active faculty logins.
- Authorize new teachers or reset faculty passwords to `teacher123`.

### 8.3 Admin Master Password
- Go to **Access Control → Admin Master Password**.
- The Master Password protects the Admin portal, Fee Ledger, and Access Control console.
- Enter the current password, type the new password, and click **Update Admin Password**.

---

## 9. Assignments, DPPs & Study Materials

Centralize digital learning materials for your students.

### 9.1 Uploading Material
1. Open **Assignments & DPPs**.
2. Click **Upload Assignment / DPP / Test Paper**.
3. Enter title, description, and category (**Assignment PDF**, **Worksheet**, or **Test Paper**).
4. Select the target batch (or select **General** for all institute students).
5. Choose the file from your computer or phone.
6. The file is uploaded to Google Drive, and students immediately receive an in-app notification!

---

## 10. Offline Marks Tracker & Exam Results

Track classroom test performance and generate PTM report cards.

### 10.1 Conducting an Offline Test
1. Open **Offline Marks Tracker**.
2. Click **Create Test Record**.
3. Specify batch, test title (e.g. `Physics Mechanics Midterm`), subject, date, and maximum marks.
4. Save the test record.

### 10.2 Grading & Publishing Scores
1. Open the test and enter each student's score.
2. Add teacher/admin remarks.
3. Click **Save All** to publish scores to student dashboards.
4. Tap **Print PTM Report Card** to produce official printed transcripts with rank, percentage, and teacher feedback.

---

## 11. Faculty & Staff Management

Maintain your faculty directory and teaching assignments.

### 11.1 Registering Teachers
1. Open **Faculty Management** and click **Add Faculty Profile**.
2. Enter faculty name, subject specialization, qualifications, experience, phone, and email.
3. Save profile. Teachers can then log in using their email or phone.

---

## 12. Results & Achievements Gallery

Promote your coaching success stories.

### 12.1 Publishing Results
1. Open **Results & Gallery** and click **Share Result Banner / Photo**.
2. Enter achievement title (e.g. `AIR 142 in JEE Advanced 2026`), student name, badge, and upload banner image.
3. Banners are immediately featured in the institute gallery for all students and teachers to view.

---

## 13. External Study Hub & Curated Resources

Curate high-yield educational links for self-study.
- Add links to NCERT solutions, reference formula sheets, and video playlists.
- Tag by subject: Physics, Chemistry, Mathematics, Biology.

---

## 14. Parent & Student Feedback Review

Review feedback submitted by parents and students.
- Monitor star ratings across Teaching Quality, DPPs, Test Series, and General Administration.
- Address concerns proactively to ensure high parent satisfaction.

---

## 15. Institute AI Assistant Guidelines

Divine Classes includes an AI Study Assistant powered by Google Gemini.
- Assists students with 24/7 academic doubt solving in Science and Mathematics.
- Ensure students connect their free Google AI Studio key inside the Chatbot module.

---

## 16. Cloud Sync, Database Backups & Data Safety

The portal uses a resilient dual-layer architecture:
- **Instant Local Storage:** Changes save immediately to device cache.
- **Cloud Database:** Automatic background synchronization with Supabase and Google Sheets.
- **Manual Sync:** Click the Cloud icon in the top header at any time to force an instant two-way sync.
- **Safety Tip:** Export the Fee Ledger to CSV at the end of each billing cycle for extra offline backup.

---

## 17. Admin Troubleshooting & Operations Manual

### Account Cannot Sign In
1. Check that the Login ID is correct (e.g. `admin`, `anil`, or `admin@divineclasses.in`).
2. Verify account is marked **Active** in Access Control (not **Blocked**).
3. If password was lost, use the Admin Master Password or reset it in Access Control.

### Cloud Sync Warning
- If the header displays "Saved locally", check your internet connection and tap the cloud button once reconnected.

---

## 18. Administrator Quick Reference Card

| Task | Navigation Path | Role Required |
|---|---|:---:|
| Create New Batch | Batches & Students → Create New Batch | Admin |
| Enroll New Student | Batches & Students → Add Student → Brand New | Admin |
| Mark Batch Attendance | Attendance → Select Date & Batch → Save | Admin / Teacher |
| View Fee Ledger | Student Fees & Reminders | Admin Only |
| Dispatch Bulk Fee Reminders | Student Fees & Reminders → Send Bulk Reminders | Admin Only |
| Reset Student Password | Access Control → Students → Key Icon | Admin Only |
| Change Admin Password | Access Control → Admin Master Password | Admin Only |
| Upload DPP / Test Paper | Assignments & DPPs → Upload | Admin / Teacher |
| Enter Test Marks | Offline Marks Tracker → Select Test → Save | Admin / Teacher |
| Print PTM Report Card | Offline Marks Tracker → Print Report | Admin / Teacher / Student |
| Add Faculty Member | Faculty Management → Add Faculty Profile | Admin Only |
| Add Result Banner | Results & Gallery → Share Result Banner | Admin Only |
| Manual Cloud Sync | Header Cloud Icon | All |

</textarea>

## 1. Welcome to Teacher Portal

Welcome to the **Divine Classes Teacher Portal**. This interface is tailor-made for educators to manage everyday academic tasks with maximum speed and zero administrative friction.

### Modules Available to Teachers
- **Dashboard:** At-a-glance summary of assigned batches, schedule, and recent uploads.
- **Batches & Students:** View your assigned batches, student rosters, roll numbers, and parent contacts.
- **Attendance:** Record daily class attendance (Present/Absent/Late) with 1-click cloud saving.
- **Assignments & DPPs:** Upload homework PDFs, chapter worksheets, and test papers directly to Google Drive.
- **Offline Marks Tracker:** Record test marks, evaluate student performance, and print PTM report cards.
- **Faculty Management:** Manage your personal profile, qualifications, and digital Faculty ID card.
- **Results & Gallery:** View institute achievements and gallery photos.
- **External Study Hub:** Curate recommended reference links and revision videos for your classes.
- **AI Assistant:** Google Gemini chatbot for lesson planning, question creation, and conceptual explanations.

> **Privacy Note:** Student Fee Ledgers, Payment Collection, and System Access Control are restricted to Institute Administrators and are not displayed in the Teacher interface.

---

## 2. Teacher Login & Account Security

### 2.1 Logging In
1. Open the institute portal on your smartphone, tablet, or laptop.
2. In the **Login ID** field, enter your registered **faculty email**, **phone number**, or **full name**.
3. In the **Password** field, enter your password (default: `teacher123`, unless customized by Admin).
4. Tick **Remember Me** to stay signed in on your personal classroom device.
5. Tap **Sign In**.

### 2.2 Account Best Practices
- Never share your login credentials with students.
- Always use the **Logout** button when working on a shared classroom computer or digital smartboard.
- If you forget your password, contact the institute Admin to have it reset instantly in Access Control.

---

## 3. Teacher Dashboard & Daily Schedule

The Dashboard gives you an immediate summary of your day:
- **Assigned Batches:** Quick count and list of classes you teach.
- **Today's Attendance Status:** Visual reminder of whether today's attendance has been marked for your batches.
- **Study Materials Uploaded:** Number of active DPPs and test papers shared with your students.
- **Offline Tests Conducted:** Overview of evaluated test series.
- **Quick Action Cards:** One-click shortcuts to take attendance, upload DPPs, or record test scores.

---

## 4. Taking Daily Class Attendance

Taking attendance takes less than 30 seconds per batch.

### 4.1 Step-by-Step Daily Roll Call
1. Open **Attendance** from the sidebar or bottom navigation bar.
2. Select the current **Month** and **Date**.
3. Select your **Batch** from the dropdown. The student roster appears automatically.
4. For each student, tap:
   - **Present** (Green button)
   - **Absent** (Red button)
   - **Late** (Amber button)
5. Tap **Save attendance** at the bottom of the roster to commit the day's record to the cloud.

### 4.2 Correcting Attendance
- If a student arrives late after attendance was saved, tap **Edit** next to their name.
- Change their status from Absent to Late or Present, and tap **Save**.
- Changes immediately sync to the cloud database and update the student's attendance percentage.

---

## 5. Monthly Attendance Registers

Review student regularity before parent meetings or tests:
- Scroll down below the daily marking grid to view the **Monthly Register**.
- See the full month's attendance matrix for your batch.
- Quickly spot chronic absentees and follow up with parents.

---

## 6. Assigned Batches & Student Roster

Understand your classroom strength:
- Open **Batches & Students**.
- Click your assigned batch card to inspect the full student roster.
- Access student roll numbers, emergency parent contacts, and batch schedules.
- You can also add existing students to your batch using **+ Add Student to Any Batch**.

---

## 7. Uploading DPPs & Study Material

Distribute homework, revision notes, and test papers digitally without printing paper worksheets.

### 7.1 How to Upload a File
1. Open **Assignments & DPPs**.
2. Click **Upload Assignment / DPP / Test Paper**.
3. Enter the document details:
   - **Title:** e.g. `Physics DPP-05 — Ray Optics & Reflection`
   - **Description:** e.g. `Complete Q1 to Q25 before Wednesday class`
   - **Category:** Select **Assignment PDF**, **Worksheet**, or **Test Paper**
   - **Batch:** Select your specific batch (or General for all batches)
4. Tap **Choose File** and select the PDF or image from your device.
5. Tap **Upload & Save**.
6. The file is uploaded to the institute's Google Drive folder, and enrolled students receive an instant in-app notification on their dashboard!

---

## 8. Offline Marks & Exam Grading

Evaluate weekly and monthly classroom tests with ease.

### 8.1 Conducting a New Test
1. Open **Offline Marks Tracker**.
2. Click **Create Test Record**.
3. Specify your batch, subject, test title (e.g. `Chemical Bonding Chapter Test`), exam date, and **Maximum Marks** (e.g. `50`).
4. Click **Create Test Record**.

### 8.2 Entering Student Marks
1. Select your batch and the test record.
2. Enter the marks scored by each student (validated against maximum marks).
3. Add qualitative remarks (e.g. `Great improvement`, `Revise molecular formulas`).
4. Click **Save All** to publish scores to student dashboards.
5. Tap **Print Report** to generate print-ready PTM report cards.

---

## 9. Teacher Profile & Faculty Card

Showcase your academic credentials:
- Open **Faculty Management** and locate your profile under **My Faculty Profile**.
- Tap **Edit My Profile** to update your bio, qualifications, subjects taught, and profile photo.
- Tap **Faculty ID Card** to generate or print your official digital faculty identification card.

---

## 10. Institute Results & Gallery

- Open **Results & Gallery** to view institute toppers, board rankers, and celebration photo albums.
- Inspire your students with past achievements.

---

## 11. External Study Hub & Resources

- Share curated video lectures, NCERT digital solutions, and reference websites with your students.
- Tap **Add Study Link**, specify the title, subject tag, and URL. Students can access them anytime under their Study Hub.

---

## 12. Reviewing Student Feedback & Doubts

- Open **Parent & Student Feedback** to view feedback submitted by students in your batches.
- Understand student perspectives on teaching pace, concept clarity, and test difficulty to continually improve classroom engagement.

---

## 13. AI Teaching & Lesson Assistant

Leverage Google Gemini as your 24/7 academic teaching assistant:
- Open **Chatbot** from the navigation menu.
- Ask questions like:
  - `Generate 5 challenging multiple-choice questions on Gravitation for Class 11 JEE.`
  - `Explain the difference between inductive and resonance effects with real chemistry examples.`
  - `Draft a 30-minute lesson outline for teaching integration by parts.`
- Copy generated explanations and questions directly into your DPP worksheets.

---

## 14. Theme & Display Settings

- Tap the **Moon / Sun** icon in the top header to toggle between **Dark Mode** and **Light Mode**.
- When using mobile phones in the classroom, use the bottom navigation bar for quick 1-thumb switching between attendance, DPPs, and marks.

---

## 15. Teacher FAQs & Troubleshooting

### A student is missing from my attendance list
- Confirm with the Admin that the student is properly enrolled in your batch in **Batches & Students**.
- Tap the **Cloud Sync icon** in the top header to refresh local data.

### I made a mistake in yesterday's attendance
- Open Attendance, select yesterday's date and batch.
- Tap **Edit** next to the student, correct the status, and tap **Save**.

### A file upload failed
- Ensure your PDF or image file is under 20MB.
- Check your internet connection and re-try.

---

</textarea>

## 1. Welcome to Student Learning Portal

Welcome to **Divine Classes**! This portal is your personal 24/7 digital academic companion. Whether you are at home, in class, or revising on the go, the portal gives you instant access to your assignments, attendance records, test marks, and academic study tools.

### What You Can Do in the Portal
- **Dashboard:** Check class notices, today's schedule, and fee alerts.
- **My Attendance:** Monitor your daily attendance and monthly percentage.
- **DPPs & Homework:** Download PDF worksheets, test papers, and class notes directly to your phone.
- **Report Cards:** Check marks scored in weekly offline tests, your rank, and teacher remarks.
- **Faculty Directory:** See who teaches you and their qualifications.
- **External Study Hub:** Watch curated educational videos and download NCERT solutions.
- **AI Study Assistant:** Ask physics, chemistry, maths, or biology doubts 24 hours a day!

---

## 2. Student Login & Access

### 2.1 How to Log In
1. Open the Divine Classes link on your phone, tablet, or laptop.
2. In the **Login ID** box, enter any of the following:
   - Your **Roll Number** (e.g. `DC-101`)
   - Your registered **Mobile Number**
   - Your **Full Name**
3. In the **Password** box, enter your student password (default: `password123`, or the password provided by the institute).
4. Check **Remember Me** so you don't have to re-enter your password every day on your phone.
5. Tap **Sign In**.

> If you ever forget your password, speak with the institute office or your batch teacher to reset it back to default in seconds.

---

## 3. Student Dashboard Overview

The Dashboard is your main home screen. It highlights everything important:
- **My Batch:** Shows your enrolled batch name and class schedule.
- **My Attendance:** Displays your real-time attendance percentage.
- **Study Materials:** Shows the number of study PDFs available for your batch.
- **Offline Tests:** Number of evaluated tests you have taken.
- **Fee Due Banner:** If a fee payment is pending, a clear banner appears with due amount and payment instructions.
- **Quick ID Card:** Tap **Student ID Card** to view and show your official institute ID card.

---

## 4. My Batch & Class Timetable

- Open **Batches & Students** from the menu or bottom bar.
- View your batch room/hall location, subject timetable, and assigned mentor.
- See your classmates and class timing schedules so you never miss a lecture.

---

## 5. My Attendance Record & Calendar

Consistency is the key to cracking competitive exams.

### 5.1 Checking Your Attendance
- Open **Attendance** or tap **View Attendance Sheet** on the Dashboard.
- See every day of the month marked clearly:
  - **Present:** Marked in Green
  - **Absent:** Marked in Red
  - **Late:** Marked in Amber
- View your **Attendance Percentage**. Aim to keep your attendance above **85%** throughout the academic session!

---

## 6. Assignments & Daily Practice Problems (DPPs)

Your teachers regularly upload homework, DPP worksheets, and sample test papers.

### 6.1 Finding and Downloading Materials
1. Open **Assignments & DPPs**.
2. All study materials uploaded for your batch (plus general institute materials) are displayed.
3. Each material card shows:
   - Title (e.g. `Maths DPP-03: Quadratic Equations`)
   - Category (`Assignment PDF`, `Worksheet`, or `Test Paper`)
   - Upload date and batch name
4. Tap **Download / View** to open the PDF directly in your browser or save it to your phone's download folder.
5. Practice the questions and bring your solved notebook to the next class!

---

## 7. My Test Marks & Report Card

Track your academic progress after every offline classroom test.

### 7.1 Viewing Test Scores
1. Open **Offline Marks Tracker**.
2. Select your batch to view your test history.
3. For each test, you will see:
   - Test Title & Subject
   - Test Date
   - **Marks Scored** out of **Maximum Marks**
   - Percentage & Class Rank
   - Teacher Remarks (e.g. `Excellent performance`, `Revise formula sheet`)

### 7.2 Printing PTM Report Card
- Tap **Print PTM Report Card** to produce a clean, official report card.
- Show it proudly to your parents or save it as a PDF for your records!

---

## 8. Faculty & Teacher Mentors

- Open **Faculty Management** to view your teachers.
- Read teacher bios, subject specializations, and qualifications.
- Find out designated doubt-clearing timings.

---

## 9. Fee Details & Online Status

Stay informed about tuition fee schedules:

- Tap **Pay / View Details** to check the pending balance, billing cycle, and institute payment details (such as official UPI ID or bank account details).
- Once fees are paid at the institute counter, your status automatically updates to **Paid**.

---

## 10. External Study Hub & Video Resources

Expand your knowledge beyond textbooks:
- Open **External Study Hub**.

- Tap **Open Material** to view the resource in a new tab.

---

## 11. Parent & Student Feedback

We value your suggestions and want to give you the best learning environment!
1. Open **Parent & Student Feedback**.

4. Give a star rating (3 to 5 stars) and write your feedback or doubt.
5. Tap **Submit Feedback**. Our management reviews every entry!

---

## 12. Divine AI Study Assistant (24/7 Doubts)

Stuck on a tricky concept at 11 PM? The **Divine AI Study Assistant** is here for you!

### 12.1 How to Use the Chatbot

**For:** Institute Administrators, Directors & Academic Coordinators  
**Role:** Admin (Full Governance & Management)

**Last updated:** November 2026

---

## Table of Contents

1. [Admin Role & Governance Overview](#1-admin-role--governance-overview)

---

## 1. Admin Role & Governance Overview

Welcome to the **Divine Classes Administrator Portal**. As an Administrator, you have complete authority over day-to-day coaching institute operations, financial records, student admissions, faculty oversight, and cloud security.

### Core Administrative Responsibilities
- **Admissions & Batches:** Create batches, schedule subjects, enroll students, and issue official ID cards.
- **Attendance Oversight:** Monitor daily student attendance marked by faculty, review monthly registers, and rectify discrepancies.
- **Financial Governance:** Maintain the **Admin Confidential Fee Ledger**, collect payments, record partial installments, and dispatch automated WhatsApp/SMS fee reminders.
- **Access Control & Security:** Authorize user accounts, reset student and teacher passwords, block delinquent accounts, and secure the **Admin Master Password**.
- **Academic Content & Marks:** Oversee DPP uploads, manage offline test series, and generate student report cards.
- **Cloud Database:** Maintain real-time cloud sync with Supabase and Google Sheets.

> The Fee Ledger, Access Control, Master Password, and Institute Settings are strictly hidden from Teachers and Students.

---

## 2. Admin Dashboard & Institute KPIs

The Dashboard acts as your central command center with high-level KPI cards and 1-click operational shortcuts.

### KPI Metric Cards
- **Active Batches:** Total active coaching batches and enrolled student count.
- **Study Uploads:** Total assignments, DPP worksheets, and test papers hosted on Google Drive.
- **Offline Class Tests:** Total evaluated exams conducted this academic cycle.
- **Pending Fees:** Total outstanding dues across all active students with instant collection tracking.

### Quick Actions
- **Create Batch:** Opens the batch setup wizard.
- **Confidential Fee Ledger:** Direct jump to payments and ledger tables.
- **Access Control:** Manage student and teacher logins and passwords.
- **Marks Tracker:** Review recent test performance.

---

## 3. Batch Creation & Scheduling

Batches structure your coaching curriculum by class, target exam, and schedule.

### 3.1 Create a New Batch
1. Open **Batches & Students** from the sidebar or bottom bar.
2. Click **Create New Batch**.
3. Fill in the batch parameters:
   - **Batch Name:** e.g. `Class 11 — JEE Advanced Physics & Maths`
   - **Room / Hall:** e.g. `Hall A (Main Campus)`
   - **Schedule & Timings:** e.g. `Mon, Wed, Fri • 4:00 PM – 7:00 PM`
   - **Subjects:** e.g. `Physics, Mathematics`
   - **Faculty Mentor:** Select assigned teacher from the dropdown.
4. Click **Create Batch**. The batch is immediately created and synced to the cloud.

### 3.2 Managing Batch Rosters
- Open any batch card to see all currently enrolled students, their roll numbers, and contact details.
- Use **View Batch Materials →** to inspect uploaded DPPs for that specific batch.

---

## 4. Student Admissions, Rosters & ID Cards

Manage student registrations from inquiry to graduation.

### 4.1 Enrolling a Brand-New Student
1. Open **Batches & Students**.
2. Click **Add Student** on the batch card, then select **Enroll Brand New Student**.
3. Fill in the student record:
   - **Full Name:** Student's legal name.
   - **Roll Number:** Unique identifier (e.g. `DC-101`).
   - **Parent / Guardian Name:** For communications.
   - **Phone / WhatsApp:** Parent contact number for attendance alerts and fee reminders.
   - **Target Batch:** Assigned class/batch.
   - **Monthly Fee / Total Course Fee:** Fee obligation.
   - **Fee Due Date:** Monthly billing cycle date.
   - **Photo:** (Optional) Upload student avatar or passport photo.
4. Click **Save Student**. The student is automatically enrolled and given login credentials (`password123`).

### 4.2 Generating Official Student ID Cards
1. Locate the student in **Batches & Students** or the Fee Ledger.
2. Click **Student ID Card**.
3. A print-ready digital identity card is generated with institute branding, roll number, batch, parent phone, and photo.
4. Tap **Print ID Card** or save as PDF to hand over to the student.

---

## 5. Institute Attendance Management

Admin has full view and editing permissions over institute-wide attendance.

### 5.1 Marking Daily Batch Attendance
1. Open **Attendance**.
2. Select the **Month**, **Date**, and **Batch**.
3. For each student, mark:
   - **Present** (Green)
   - **Absent** (Red)
   - **Late** (Amber)
4. Click **Save attendance** to commit records to the database.

### 5.2 Reviewing Monthly Registers
- Scroll down to the **Monthly Register** table below the marking grid.
- View the entire month's attendance matrix for the batch.
- Click **Edit** next to any student to unlock and correct past attendance entries.

---

## 6. Confidential Fee Ledger & Payments

The Fee Ledger is strictly confidential and visible only to Administrators.

### 6.1 Financial Summary Cards
- **Monthly Expected Fees:** Total monthly revenue expected from enrolled students.
- **Total Fees Collected:** Cumulative revenue received to date.
- **Fee Due Students:** Number of students with outstanding dues.
- **Collection Health:** Percentage of students whose payments are up to date.

### 6.2 Recording Fee Payments
1. Open **Student Fees & Reminders**.
2. Locate the student using the search bar (filter by name, roll number, or mobile).
3. Click the **Record Payment** action.
4. Enter the amount received, payment mode (Cash, UPI, Cheque, Bank Transfer), and optional transaction note.
5. Click **Confirm Payment**. The student's balance updates in real time, and their dashboard reflects the new payment status.

### 6.3 Exporting Fees to CSV
- Click **Export to CSV** at the top of the Fee Ledger.
- Downloads a clean spreadsheet containing student names, roll numbers, fees, paid amounts, due balances, and parent phones for offline accounting audits.

---

## 7. WhatsApp & SMS Fee Reminders

Quickly notify parents regarding overdue fees with zero manual typing.

### 7.1 Single Student Reminder
- Click the **bell / reminder icon** next to any student with pending dues.
- Instantly sends an in-app alert to the student's dashboard and prepares a WhatsApp/SMS alert for the parent.

### 7.2 Send Bulk Reminders (N)
- When multiple students have pending balances, a prominent orange button appears: **Send Bulk Reminders (N)**.
- Tap this button once to dispatch reminder alerts to all students with overdue fees simultaneously.

---

## 8. Access Control & Password Management

Safeguard institute integrity with centralized credential management.

### 8.1 Students Account Control
- **Search & Filter:** Find students by roll number, name, or batch.
- **Authorize All:** Instantly activates all newly registered students in one tap.
- **Reset to Default:** Sets student password back to `password123` if they forgot it.
- **Block / Unblock:** Temporarily lock accounts of suspended or fee-defaulting students. Blocked users cannot sign in and are shown an administrative contact notice.

### 8.2 Teachers Account Control
- View active faculty logins.
- Authorize new teachers or reset faculty passwords to `teacher123`.

### 8.3 Admin Master Password
- Go to **Access Control → Admin Master Password**.
- The Master Password protects the Admin portal, Fee Ledger, and Access Control console.
- Enter the current password, type the new password, and click **Update Admin Password**.

---

## 9. Assignments, DPPs & Study Materials

Centralize digital learning materials for your students.

### 9.1 Uploading Material
1. Open **Assignments & DPPs**.
2. Click **Upload Assignment / DPP / Test Paper**.
3. Enter title, description, and category (**Assignment PDF**, **Worksheet**, or **Test Paper**).
4. Select the target batch (or select **General** for all institute students).
5. Choose the file from your computer or phone.
6. The file is uploaded to Google Drive, and students immediately receive an in-app notification!

---

## 10. Offline Marks Tracker & Exam Results

Track classroom test performance and generate PTM report cards.

### 10.1 Conducting an Offline Test
1. Open **Offline Marks Tracker**.
2. Click **Create Test Record**.
3. Specify batch, test title (e.g. `Physics Mechanics Midterm`), subject, date, and maximum marks.
4. Save the test record.

### 10.2 Grading & Publishing Scores
1. Open the test and enter each student's score.
2. Add teacher/admin remarks.
3. Click **Save All** to publish scores to student dashboards.
4. Tap **Print PTM Report Card** to produce official printed transcripts with rank, percentage, and teacher feedback.

---

## 11. Faculty & Staff Management

Maintain your faculty directory and teaching assignments.

### 11.1 Registering Teachers
1. Open **Faculty Management** and click **Add Faculty Profile**.
2. Enter faculty name, subject specialization, qualifications, experience, phone, and email.
3. Save profile. Teachers can then log in using their email or phone.

---

## 12. Results & Achievements Gallery

Promote your coaching success stories.

### 12.1 Publishing Results
1. Open **Results & Gallery** and click **Share Result Banner / Photo**.
2. Enter achievement title (e.g. `AIR 142 in JEE Advanced 2026`), student name, badge, and upload banner image.
3. Banners are immediately featured in the institute gallery for all students and teachers to view.

---

## 13. External Study Hub & Curated Resources

Curate high-yield educational links for self-study.
- Add links to NCERT solutions, reference formula sheets, and video playlists.
- Tag by subject: Physics, Chemistry, Mathematics, Biology.

---

## 14. Parent & Student Feedback Review

Review feedback submitted by parents and students.
- Monitor star ratings across Teaching Quality, DPPs, Test Series, and General Administration.
- Address concerns proactively to ensure high parent satisfaction.

---

## 15. Institute AI Assistant Guidelines

Divine Classes includes an AI Study Assistant powered by Google Gemini.
- Assists students with 24/7 academic doubt solving in Science and Mathematics.
- Ensure students connect their free Google AI Studio key inside the Chatbot module.

---

## 16. Cloud Sync, Database Backups & Data Safety

The portal uses a resilient dual-layer architecture:
- **Instant Local Storage:** Changes save immediately to device cache.
- **Cloud Database:** Automatic background synchronization with Supabase and Google Sheets.
- **Manual Sync:** Click the Cloud icon in the top header at any time to force an instant two-way sync.
- **Safety Tip:** Export the Fee Ledger to CSV at the end of each billing cycle for extra offline backup.

---

## 17. Admin Troubleshooting & Operations Manual

### Account Cannot Sign In
1. Check that the Login ID is correct (e.g. `admin`, `anil`, or `admin@divineclasses.in`).
2. Verify account is marked **Active** in Access Control (not **Blocked**).
3. If password was lost, use the Admin Master Password or reset it in Access Control.

### Cloud Sync Warning
- If the header displays "Saved locally", check your internet connection and tap the cloud button once reconnected.

---

## 18. Administrator Quick Reference Card

| Task | Navigation Path | Role Required |
|---|---|:---:|
| Create New Batch | Batches & Students → Create New Batch | Admin |
| Enroll New Student | Batches & Students → Add Student → Brand New | Admin |
| Mark Batch Attendance | Attendance → Select Date & Batch → Save | Admin / Teacher |
| View Fee Ledger | Student Fees & Reminders | Admin Only |
| Dispatch Bulk Fee Reminders | Student Fees & Reminders → Send Bulk Reminders | Admin Only |
| Reset Student Password | Access Control → Students → Key Icon | Admin Only |
| Change Admin Password | Access Control → Admin Master Password | Admin Only |
| Upload DPP / Test Paper | Assignments & DPPs → Upload | Admin / Teacher |
| Enter Test Marks | Offline Marks Tracker → Select Test → Save | Admin / Teacher |
| Print PTM Report Card | Offline Marks Tracker → Print Report | Admin / Teacher / Student |
| Add Faculty Member | Faculty Management → Add Faculty Profile | Admin Only |
| Add Result Banner | Results & Gallery → Share Result Banner | Admin Only |
| Manual Cloud Sync | Header Cloud Icon | All |

</textarea>

## 1. What This Portal Does

Divine Classes is a complete coaching-institute management portal. It lets the institute:

- Manage batches and student records.
- Mark daily attendance and view monthly registers.
- Track student fees and send payment reminders.
- Control who can log in and reset passwords.
- Upload assignments, DPPs and test papers.
- Record offline test marks and print report cards.
- Manage faculty profiles and ID cards.
- Publish result banners and event photos.
- Share external study links.
- Collect parent and student feedback.
- Provide an AI study assistant (Gemini chatbot).
- Back up and synchronise data to the cloud.

The portal works on **laptop/desktop** and **mobile/Android**. On mobile, the main modules are available from the bottom navigation bar.

---

## 2. Roles and Permissions

There are four roles. Each role sees a different set of pages.

| Module | Admin | Teacher | Student | Developer |
|---|:---:|:---:|:---:|:---:|
| Dashboard | ✅ | ✅ | ✅ | ✅ |
| Batches & Students | ✅ | ✅ | ✅ (own batch only) | ✅ |
| Attendance | ✅ | ✅ | ✅ (own record) | ✅ |
| Student Fees & Reminders | ✅ | ❌ | ❌ | ✅ |
| Access Control | ✅ | ❌ | ❌ | ✅ |
| Assignments & DPPs | ✅ | ✅ | ✅ (own batch) | ✅ |
| Offline Marks Tracker | ✅ | ✅ | ✅ (own report card) | ✅ |
| Faculty Management | ✅ | ✅ (own profile) | ✅ (view only) | ✅ |
| Results & Gallery | ✅ | ✅ | ✅ | ✅ |
| External Study Hub | ✅ | ✅ | ✅ | ✅ |
| Parent & Student Feedback | ✅ | ✅ | ✅ | ✅ |
| Chatbot | ✅ | ✅ | ✅ | ✅ |
| Settings | ❌ | ❌ | ❌ | ✅ |

### Important role rules

- **Admin is not a Developer.** Admin does not get Developer permissions and cannot open Settings.
- **Settings is Developer-only.** Only the Developer can change global portal settings, database connections, demo data and role access.
- **Admin** manages day-to-day institute work: students, batches, attendance, fees, access control, materials, marks, faculty, gallery, links and feedback.
- **Teacher** manages their own profile, attendance, materials, marks and can add students to batches. Teachers cannot see fees or Access Control.
- **Student** sees only their own batch, attendance, materials, marks and profile-related information. Fees and Access Control are hidden.
- **Developer** can see every page and every setting.

> The Developer can also change which modules Admin, Teacher and Student can see from **Settings → Portal Access by Role**.

---

## 3. Getting Started

### What you need

- The portal web link supplied by the institute/developer.
- A supported browser: Chrome, Microsoft Edge, Safari or the Android browser.
- An internet connection for cloud sync.
- Your Login ID and password.

### First-time setup (Developer)

1. Open **Settings**.
2. Fill in **Institute Profile**, **Contact & Payments** and **Social Media Channels**.
3. Set a strong **Master Admin Password** in **Portal Security & Passwords**.
4. Connect the **Primary Cloud Database** and, if required, the **Cloud Mirror Backup**.
5. Review **Portal Access by Role**.
6. Turn **OFF** requirement labels and demo data before handing the portal to the client.
7. Save all settings.

### First-time setup (Admin)

1. Log in with the Admin ID and password.
2. Open **Batches & Students** and create the first batch.
3. Add students to the batch.
4. Open **Faculty Management** and add faculty profiles.
5. Open **Access Control** and confirm student/faculty accounts are authorised.
6. Change the Admin Master Password from **Access Control → Admin Master Password**.

---

## 4. Logging In

### 4.1 Login screen

Open the portal link. The login card asks for:

- **Login ID** — Roll Number, Email, Phone Number or Admin ID.
- **Password**.
- **Remember me** — keeps you signed in on this device.
- **Forgot Password?** — shows the institute contact number.

Tap the **eye icon** to show or hide the password.

### 4.2 Login IDs by role

| Role | What to enter as Login ID | Default password |
|---|---|---|
| **Admin** | `admin`, `anil`, `anil chahar`, or `admin@divineclasses.in` | `admin123` (or `admin`) |
| **Teacher** | Faculty email, phone number, or full name | `teacher123` (unless changed) |
| **Student** | Roll number (e.g. `DC-101`), phone number, or full name | `password123` (unless changed) |
| **Developer** | Lead Developer email configured on the server | Set in server Script Properties |

> Passwords are case-sensitive. If the institute has changed a password, use the new one. Contact the Admin if you have forgotten it.

### 4.3 Blocked or inactive accounts

- **Blocked** — the account cannot sign in. A helpline message appears.
- **Inactive** — the account is archived and hidden from normal lists.

Only an Admin can block, unblock or reactivate accounts from **Access Control**.

### 4.4 Session and auto-logout

- If **Remember me** is ticked, the session can last up to **30 days**.
- After **2 hours of inactivity**, the portal automatically logs you out for security.
- Always use the **logout button** on a shared computer.

---

## 5. The Main Screen

### 5.1 Header (top bar)

From left to right:

| Icon / area | What it does |
|---|---|
| **☰ Menu** | Opens or closes the sidebar. |
| **Page title** | Shows the current module. |
| **Cloud icon** | Manually syncs data with the cloud database. |
| **Moon / Sun icon** | Switches between Light and Dark theme (if your role is allowed). |
| **Bell icon** | Opens notifications. A red badge shows unread items. |
| **Profile / Logout** | Shows your account and the logout button (on mobile view, displayed as a 4th compact square button with equal spacing matching the other 3 controls). |

### 5.2 Sidebar

The sidebar lists every module your role can access. On mobile, use the **bottom navigation bar** instead.

### 5.3 Mobile bottom navigation

The bottom bar gives one-tap access to the main modules. The active module is highlighted. Some modules may be hidden depending on **Portal Access by Role**.

### 5.4 Notifications

Open the **bell icon** to see:

- Fee reminders.
- New study-material alerts.
- Institute notices.

Students receive fee reminders here and also see a reminder banner on the Dashboard.

### 5.5 Cloud sync indicator

The cloud button shows the sync state:

- **Syncing with Cloud…** — upload in progress.
- **✓ Cloud Synced** — data is up to date.
- **Saved locally** — saved on this device; cloud sync will retry.

---

## 6. Dashboard

The Dashboard is the home screen. It gives a quick summary of the institute.

### Admin dashboard

- **Active Batches** — number of batches and enrolled students.
- **Study Uploads** — total assignments, DPPs and test papers.
- **Offline Class Tests** — number of tests conducted.
- **Pending Fees** — total outstanding amount.
- Quick-action cards open the related module.
- Recent activity and cloud status.

### Teacher dashboard

- Assigned batches.
- Study uploads.
- Offline tests.
- Quick access to attendance, materials and marks.

### Student dashboard

- **My Batch** — the batch the student belongs to.
- **My Batch Materials** — files for the student's batch.
- **Offline Class Tests** — tests conducted.
- **My Attendance** — attendance percentage.
- **Fee reminder banner** — appears when a fee is due, with a **Pay / View Details** button.
- Buttons for **Student ID Card** and **View Attendance Sheet**.

> Dashboard cards are clickable and take you straight to the module.

---

## 7. Batches & Students

This module manages coaching batches and the students inside them.

### 7.1 Create a new batch (Admin / Developer)

1. Open **Batches & Students**.
2. Click **Create New Batch**.
3. Enter the batch name, room/hall, schedule, subjects and mentor.
4. Click **Create Batch**.

### 7.2 Add a student to a batch

**Admin:**

1. Open the batch card.
2. Click **Add Student**.
3. Choose an existing student or register a new one.
4. Save.

**Teacher:**

1. Open **Batches & Students**.
2. Click **+ Add Student to Any Batch**.
3. Select the batch and student.
4. Save.

### 7.3 Register a brand-new student

When adding a student, choose **Option 2: Enroll Brand New Student** and fill in:

- Full name.
- Roll number.
- Parent name.
- Phone number.
- Batch.
- Monthly fee / total fee.
- Due date.
- Photo (optional).

The student can then log in with their roll number, phone number or name.

### 7.4 View batch details

Each batch card shows:

- Room/hall.
- Schedule.
- Subjects.
- Mentor.
- Enrolled students.
- **View Batch Materials →** shortcut.

Students see only their own batch and classmates.

### 7.5 Student ID card

Admin, Teacher (where permitted) and the student can open a student's **ID Card**. The card can be printed or shared from the browser.

---

## 8. Attendance

Attendance is available to Admin, Teacher and Student.

### 8.1 Mark daily attendance (Admin / Teacher)

1. Open **Attendance**.
2. Select the **month**.
3. Select the **date**.
4. Select the **batch**.
5. For each student, choose:
   - **Present**
   - **Absent**
   - **Late**
6. Click **Save** next to a student, or use **Save attendance** to save the whole day.

### 8.2 Monthly register

Below the daily marking area, the monthly register shows saved records for the selected batch and month. Use it to review or correct attendance.

### 8.3 Edit attendance

- Use **Edit** next to a student to unlock a saved record.
- Change the status and save again.
- Use **Sync** to reload the month from the database.

### 8.4 Student view

Students see:

- Their own attendance percentage.
- Present / absent counts.
- The monthly attendance sheet.
- **View Attendance Sheet** from the Dashboard.

## 21. Cloud Sync and Data Safety

### 21.1 How saving works

- Changes are saved on the device immediately.
- The portal then syncs to the cloud database automatically.
- The header cloud button forces a manual sync.

### 21.2 Primary database and backup

- **Primary Cloud Database** stores students, batches, attendance, materials, tests, gallery, feedback and notifications.
- **Cloud Mirror Backup** keeps a secondary copy when enabled.
- **Google Sheets** can be used as a backup/mirror.
- The all-data clear removes **External Study Links Hub** records but preserves **Settings_Config** and Supabase `settings_config`.

### 21.3 Offline mode

If the internet drops:

- The portal keeps working with saved data.
- A message says **Offline Mode: Using saved data on your phone**.
- When the connection returns, cloud sync resumes.

### 21.4 Cross-device sync

Settings and data changes sync automatically between the laptop browser and Android app while Supabase is enabled and both have an internet connection. Settings are checked every 4 seconds while the app is open; when Android resumes a paused app, it checks immediately. Sync happens without reloading the page.

If a change is not visible, check the internet connection and confirm the cloud database is enabled. The cloud icon can still be clicked for a manual sync.

### 21.5 Data safety rules

- Do not clear browser data unless you have a cloud backup.
- Use **Clear All Application Data** only when you are ready to remove all institute records, including genuine client data. External Study Links are preserved.
- Keep the **Settings_Config** tab and Supabase `settings_config` table intact.
- Export fee data to CSV regularly as an extra backup.
- Take a Google Sheets backup before major changes.

## 22. Dummy / Demo Data

The portal can create six sample records per table for testing.

### 22.1 Demo data availability

The Developer can use **Show Dummy / Demo Data (Seed Records)** to add sample records for testing. A permanent wipe removes the current sample records, but the Developer can explicitly create them again later. Genuine records are preserved.

Use **Create Demo Data** in **Settings → Database Connections** or turn ON **Show Dummy / Demo Data**. The app verifies the records in its Apps Script Cloud Database and Supabase before reporting success; the button remains available after creation. If Supabase rejects or cannot return the rows (for example due to table schema or RLS permissions), the error is shown instead of a success message. Demo data also refreshes matching Google Sheets tabs and the settings list in **Settings_Config** and Supabase `settings_config`. Admin/Developer password settings and the Supabase key are excluded from Supabase settings and snapshots.

### 22.2 Permanently clear application data

Developer: **Settings → Demo Data & Database Setup → Clear All Application Data**.

This clears application records from the Apps Script Cloud Database, Google Sheets, and Supabase while preserving the **External_Links_Hub** sheet and Supabase external-links tables. Confirm with your Developer email and password, then type **CLEAR ALL APPLICATION DATA**.

- Student, teacher, batch, attendance, material, test, gallery, feedback, and notification records are cleared. External Study Links remain available.
- `Settings_Config`, Supabase `settings_config`, operational settings, and Google Sheets tab headers are preserved so the app remains configured. Only the demo-data wipe flags are updated.
- The portal disables demo-data creation after the clear. The button remains available to clear records added later.
- The current device clears its pending sync state. Connected devices receive the updated snapshot; stale pre-clear state is rejected or replaced before it can sync again.

If Apps Script reports that its daily `UrlFetch` quota is exhausted, use `clear_supabase_data.py` from the project folder. Run `python3 clear_supabase_data.py` for a read-only preview, then `python3 clear_supabase_data.py --execute` to proceed. The script prompts for the Supabase project URL and API key; use a key authorized to delete rows. Alternatively, review `clear_supabase_data.sql` carefully, then run it in the Supabase SQL Editor; it commits the deletion. Both options clear Supabase only, preserve external links and operational settings, and do not clear Google Sheets. Never commit or share a privileged API key.

## 24. Troubleshooting

### I cannot log in

- Check the Login ID: roll number, email, phone or Admin ID.
- Check Caps Lock and the password spelling.
- Ask the Admin to confirm the account is **Active**, not **Blocked** or **Inactive**.
- Ask the Admin to reset the password from **Access Control**.

### The Demo buttons are missing

Developer: **Settings → Demo Login Button → Show Demo Button on Login Page** → ON.

### I cannot see a module

- Your role may not have access.
- Developer: check **Settings → Portal Access by Role**.
- Admin/Teacher/Student: ask the Developer to enable it.

### I cannot see Settings

Settings is **Developer-only**. Admin does not have Developer permissions. Use **Access Control** for passwords and account access.

### Changes are not showing on another device

1. Click the **cloud icon** to sync.
2. Refresh the page.
3. Check the internet connection.
4. Confirm the cloud database is enabled.

### Fee reminders are not appearing

- The student must have a pending balance.
- The reminder must be sent from **Student Fees & Reminders**.
- The student should check the **bell icon** and the Dashboard banner.

### A file will not upload

- Check the Google Drive folder link and sharing permissions.
- Check the file size and format.
- Try a smaller file.
- Confirm the Drive account is connected.

### The chatbot is not working

- Confirm **Settings → Portal Chatbot** is ON.
- Click **Connect Gemini** and paste a valid Google AI Studio key.
- Check the Gemini free-tier quota.
- Try **New Chat**.

### The theme button is missing

Developer: **Settings → Portal Appearance & Theme → Theme button access by role** → enable the role.

### The phone stays dark

- Set the browser's dark mode to **System default** or **Off**.
- Clear the browser cache for the portal.
- Reload the page.
- Try an InPrivate/Incognito tab to test whether the issue is cache-related.

### The page looks outdated

- Refresh the page.
- Clear the browser cache.
- Close and reopen the browser.
- Ask the Developer to confirm the latest version was deployed.

### Data disappeared after clearing demo data

After a permanent demo-data wipe, the records are removed from connected stores. A Developer can create fresh demo/testing records again using **Show Dummy / Demo Data (Seed Records)**; previous non-demo records are not restored by that action.

        'theme': { icon: 'fa-palette', gradient: 'from-pink-500 to-purple-600', color: 'text-pink-500' },
        'cloud sync': { icon: 'fa-cloud-arrow-up', gradient: 'from-cyan-500 to-teal-600', color: 'text-cyan-500' },
        'troubleshooting': { icon: 'fa-wrench', gradient: 'from-rose-500 to-amber-600', color: 'text-rose-500' },
        'quick reference': { icon: 'fa-id-card', gradient: 'from-emerald-500 to-teal-600', color: 'text-emerald-500' },
        'settings': { icon: 'fa-sliders', gradient: 'from-indigo-600 to-purple-700', color: 'text-indigo-500' },
        'demo mode': { icon: 'fa-flask', gradient: 'from-amber-500 to-orange-600', color: 'text-amber-500' }
    };

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .split('&').join('&amp;')
            .split('<').join('&lt;')
            .split('>').join('&gt;')
            .split('"').join('&quot;')
            .split("'").join('&#39;');
    }

    function getGuideSectionMeta(title) {
        const clean = (title || '').replace(/^(\d+\.?\s*)/, '').toLowerCase().trim();
        for (const [k, meta] of Object.entries(GUIDE_SECTION_ICONS)) {
            if (clean.includes(k) || k.includes(clean)) return meta;
        }
        return { icon: 'fa-book-bookmark', gradient: 'from-sky-500 to-indigo-600', color: 'text-sky-500' };
    }

    function formatInlineGuide(str) {
        if (!str) return '';
        let s = escapeHtml(str);
        s = s.replace(/\*\*([^\*]+)\*\*/g, '<strong class="font-bold text-slate-900 dark:text-slate-100">$1</strong>');
        s = s.replace(/\*([^\*]+)\*/g, '<em class="italic text-slate-700 dark:text-slate-300">$1</em>');
        s = s.replace(/`([^`]+)`/g, '<code class="px-1.5 py-0.5 rounded-md font-mono text-[11px] bg-slate-100 dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 border border-slate-200 dark:border-slate-700 font-semibold">$1</code>');
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(m, txt, href) {
            if (href && href.startsWith('#')) {
                const anchorId = 'guide-sec-' + href.slice(1).toLowerCase().replace(/[^a-z0-9]+/g, '-');
                return '<a href="javascript:void(0)" onclick="scrollGuideTo(\'' + anchorId + '\')" class="font-semibold text-sky-600 hover:text-sky-700 dark:text-sky-400 dark:hover:text-sky-300 underline decoration-sky-300 dark:decoration-sky-700 underline-offset-2 transition">' + txt + '</a>';
            }
            return '<a href="' + href + '" target="_blank" rel="noopener noreferrer" class="font-semibold text-sky-600 hover:text-sky-700 dark:text-sky-400 underline underline-offset-2">' + txt + ' <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i></a>';
        });
        s = s.replace(/✅/g, '<span class="inline-flex items-center justify-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/70 dark:text-emerald-300">✅ Allowed</span>');
        s = s.replace(/❌/g, '<span class="inline-flex items-center justify-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800 dark:bg-rose-950/70 dark:text-rose-300">❌ No</span>');
        return s;
    }

    window.parseGuideMarkdownToHtml = function(markdown) {
        const lines = (markdown || '').split('\n');
        let out = [];
        let inTable = false;
        let tableHeaders = [];
        let tableRows = [];
        let inList = false;
        let inNumList = false;
        let inCallout = false;
        let calloutType = 'note';
        let calloutLines = [];
        let sectionOpen = false;

        function flushList() {
            if (inList) { out.push('</ul>'); inList = false; }
            if (inNumList) { out.push('</ol>'); inNumList = false; }
        }

        function flushTable() {
            if (!inTable) return;
            let t = '<div class="overflow-x-auto my-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-2xs">';
            t += '<table class="min-w-full divide-y divide-slate-200 dark:divide-slate-700 text-xs text-left">';
            if (tableHeaders.length) {
                t += '<thead class="bg-slate-100/90 dark:bg-slate-800/90 text-slate-700 dark:text-slate-200 font-bold uppercase tracking-wider text-[10px]"><tr>';
                tableHeaders.forEach(function(th) {
                    t += '<th class="px-3.5 py-3 font-bold">' + formatInlineGuide(th) + '</th>';
                });
                t += '</tr></thead>';
            }
            t += '<tbody class="divide-y divide-slate-100 dark:divide-slate-800 bg-white dark:bg-slate-900/50">';
            tableRows.forEach(function(row, idx) {
                t += '<tr class="' + (idx % 2 === 1 ? 'bg-slate-50/60 dark:bg-slate-800/30' : '') + ' hover:bg-sky-50/50 dark:hover:bg-slate-800/60 transition">';
                row.forEach(function(cell) {
                    t += '<td class="px-3.5 py-2.5 leading-relaxed text-slate-700 dark:text-slate-300 font-medium">' + formatInlineGuide(cell) + '</td>';
                });
                t += '</tr>';
            });
            t += '</tbody></table></div>';
            out.push(t);
            inTable = false;
            tableHeaders = [];
            tableRows = [];
        }

        function flushCallout() {
            if (!inCallout) return;
            const config = {
                note: { bg: 'bg-sky-50 dark:bg-sky-950/40 border-sky-500 text-sky-900 dark:text-sky-200', icon: 'fa-circle-info text-sky-600 dark:text-sky-400', label: 'NOTE' },
                warning: { bg: 'bg-amber-50 dark:bg-amber-950/40 border-amber-500 text-amber-900 dark:text-amber-200', icon: 'fa-triangle-exclamation text-amber-600 dark:text-amber-400', label: 'IMPORTANT' },
                tip: { bg: 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500 text-emerald-900 dark:text-emerald-200', icon: 'fa-lightbulb text-emerald-600 dark:text-emerald-400', label: 'TIP' }
            }[calloutType] || { bg: 'bg-slate-50 dark:bg-slate-900/40 border-slate-500 text-slate-900 dark:text-slate-200', icon: 'fa-circle-info text-slate-600', label: 'INFO' };

            out.push('<div class="my-4 p-4 rounded-xl border-l-4 ' + config.bg + ' shadow-2xs text-xs leading-relaxed"><div class="flex items-start gap-3"><i class="fa-solid ' + config.icon + ' text-base mt-0.5 shrink-0"></i><div class="space-y-1"><span class="text-[10px] font-bold tracking-wider uppercase opacity-80 block">' + config.label + '</span><div class="font-medium">' + calloutLines.map(formatInlineGuide).join('<br>') + '</div></div></div></div>');
            inCallout = false;
            calloutLines = [];
        }

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) {
                flushList();
                flushTable();
                flushCallout();
                continue;
            }

            if (line.startsWith('>')) {
                flushList();
                flushTable();
                const text = line.replace(/^>\s*/, '');
                if (!inCallout) {
                    inCallout = true;
                    calloutType = /warning|danger|caution|important/i.test(text) ? 'warning' : (/tip|success|best practice/i.test(text) ? 'tip' : 'note');
                    calloutLines = [text];
                } else {
                    calloutLines.push(text);
                }
                continue;
            } else {
                flushCallout();
            }

            if (line.startsWith('|') && line.endsWith('|')) {
                flushList();
                const cells = line.slice(1, -1).split('|').map(function(c) { return c.trim(); });
                if (cells.every(function(c) { return /^:?-+:?$/.test(c); })) {
                    continue;
                }
                if (!inTable) {
                    inTable = true;
                    tableHeaders = cells;
                    tableRows = [];
                } else {
                    tableRows.push(cells);
                }
                continue;
            } else {
                flushTable();
            }

            if (/^---$|^___$|^\*\*\*$/.test(line)) {
                flushList();
                out.push('<hr class="my-6 border-slate-200 dark:border-slate-700/80">');
                continue;
            }

            if (line.startsWith('# ')) {
                flushList();
                const title = line.slice(2).trim();
                let rolePill = 'User Guide';
                let roleColor = 'from-sky-600 via-indigo-600 to-purple-600';
                if (/admin/i.test(title)) {
                    rolePill = '👑 Administrator Guide';
                    roleColor = 'from-indigo-600 via-purple-600 to-sky-700';
                } else if (/teacher/i.test(title)) {
                    rolePill = '👨‍🏫 Teacher & Faculty Guide';
                    roleColor = 'from-amber-600 via-orange-600 to-indigo-700';
                } else if (/student/i.test(title)) {
                    rolePill = '🎓 Student Learning Guide';
                    roleColor = 'from-sky-600 via-teal-600 to-indigo-700';
                } else if (/developer/i.test(title)) {
                    rolePill = '💻 Developer Technical Manual';
                    roleColor = 'from-purple-700 via-indigo-800 to-slate-900';
                }

                out.push('<div class="mb-6 p-6 sm:p-8 rounded-2xl bg-gradient-to-r ' + roleColor + ' text-white shadow-xl relative overflow-hidden"><div class="absolute -right-10 -bottom-10 w-48 h-48 rounded-full bg-white/10 blur-2xl pointer-events-none"></div><div class="flex items-center gap-2.5 mb-3 flex-wrap"><span class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur-xs flex items-center justify-center text-xl font-bold shadow-inner"><i class="fa-solid fa-graduation-cap"></i></span><span class="px-3 py-1 rounded-full text-[10px] font-extrabold bg-white/20 tracking-wider uppercase backdrop-blur-xs">' + rolePill + '</span><span class="px-3 py-1 rounded-full text-[10px] font-extrabold bg-emerald-400/30 text-emerald-100 tracking-wider uppercase backdrop-blur-xs">Cloud Edition v2.5</span></div><h1 class="text-xl sm:text-2xl lg:text-3xl font-black tracking-tight leading-tight">' + escapeHtml(title) + '</h1><p class="text-xs sm:text-sm text-sky-100 mt-2 leading-relaxed max-w-2xl">Complete visual step-by-step instructions, academic workflows, and tools for your login role.</p></div>');
                continue;
            }

            if (line.startsWith('## ')) {
                flushList();
                if (sectionOpen) {
                    out.push('</div></details>');
                    sectionOpen = false;
                }
                const title = line.slice(3).trim();
                const meta = getGuideSectionMeta(title);
                const anchorId = 'guide-sec-' + title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                const numMatch = title.match(/^(\d+)\.\s*(.*)/);
                const numBadge = numMatch ? '<span class="inline-flex items-center justify-center px-2 py-0.5 rounded-lg text-xs font-black bg-gradient-to-r ' + meta.gradient + ' text-white shadow-xs shrink-0">' + numMatch[1] + '</span>' : '';
                const displayTitle = numMatch ? numMatch[2] : title;

                out.push('<details id="' + anchorId + '" data-guide-section="' + escapeHtml(title.toLowerCase()) + '" class="guide-card group mb-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-xs overflow-hidden transition-all duration-200 hover:border-indigo-400 dark:hover:border-indigo-500" open>');
                out.push('<summary class="px-4 py-3 sm:px-5 sm:py-3.5 bg-gradient-to-r from-slate-50 via-slate-50/80 to-indigo-50/30 dark:from-slate-800 dark:via-slate-800 dark:to-slate-800/90 flex items-center justify-between gap-3 cursor-pointer select-none list-none [&::-webkit-details-marker]:hidden hover:bg-slate-100 dark:hover:bg-slate-700/60 transition sticky top-0 z-10 backdrop-blur-md">');
                out.push('<div class="flex items-center gap-2.5 sm:gap-3 min-w-0">');
                out.push('<span class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr ' + meta.gradient + ' text-white flex items-center justify-center text-sm shadow-sm shrink-0"><i class="fa-solid ' + meta.icon + '"></i></span>');
                out.push('<div class="flex items-center gap-2 min-w-0"><span class="shrink-0">' + numBadge + '</span><h2 class="text-xs sm:text-sm md:text-base font-black text-slate-900 dark:text-slate-100 font-heading tracking-tight leading-snug truncate">' + formatInlineGuide(displayTitle) + '</h2></div>');
                out.push('</div>');
                out.push('<div class="flex items-center gap-2 shrink-0">');
                out.push('<span class="text-[10px] font-bold text-slate-400 group-open:hidden uppercase tracking-wider hidden sm:inline">Tap to expand</span>');
                out.push('<span class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-500 group-hover:text-indigo-600 transition"><i class="fa-solid fa-chevron-down text-xs transition-transform duration-200 group-open:rotate-180"></i></span>');
                out.push('</div>');
                out.push('</summary>');
                out.push('<div class="p-4 sm:p-5 space-y-3.5 text-xs sm:text-[13px] text-slate-700 dark:text-slate-200 leading-relaxed border-t border-slate-100 dark:border-slate-800">');
                sectionOpen = true;
                continue;
            }

            if (line.startsWith('### ')) {
                flushList();
                const title = line.slice(4).trim();
                out.push('<h3 class="text-sm sm:text-base font-black text-slate-900 dark:text-slate-100 mt-6 mb-3 pt-3.5 border-t border-slate-200/80 dark:border-slate-700/80 flex items-center gap-2.5"><span class="w-3 h-3 rounded-full bg-gradient-to-r from-sky-500 to-indigo-600 shrink-0 shadow-xs ring-2 ring-sky-400/30"></span><span class="font-extrabold tracking-tight">' + formatInlineGuide(title) + '</span></h3>');
                continue;
            }

            if (line.startsWith('#### ')) {
                flushList();
                const title = line.slice(5).trim();
                out.push('<h4 class="text-xs sm:text-sm font-bold text-indigo-700 dark:text-indigo-300 mt-4 mb-2 flex items-center gap-2"><i class="fa-solid fa-angle-right text-indigo-500 text-xs font-black"></i><span class="font-bold">' + formatInlineGuide(title) + '</span></h4>');
                continue;
            }

            if (/^[-*]\s+/.test(line)) {
                if (inNumList) flushList();
                if (!inList) {
                    out.push('<ul class="space-y-2 my-2.5 pl-1">');
                    inList = true;
                }
                const itemText = line.replace(/^[-*]\s+/, '');
                out.push('<li class="flex items-start gap-2.5 text-xs text-slate-700 dark:text-slate-300"><i class="fa-solid fa-circle-check text-sky-500 text-[11px] mt-0.5 shrink-0"></i><span class="leading-relaxed">' + formatInlineGuide(itemText) + '</span></li>');
                continue;
            }

            const numMatch = line.match(/^(\d+)\.\s+(.*)/);
            if (numMatch) {
                if (inList) flushList();
                if (!inNumList) {
                    out.push('<ol class="space-y-2.5 my-2.5 pl-1">');
                    inNumList = true;
                }
                out.push('<li class="flex items-start gap-2.5 text-xs text-slate-700 dark:text-slate-300"><span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-sky-100 text-sky-700 dark:bg-sky-950 dark:text-sky-300 text-[10px] font-bold shrink-0 mt-0.5">' + numMatch[1] + '</span><span class="leading-relaxed">' + formatInlineGuide(numMatch[2]) + '</span></li>');
                continue;
            }

            flushList();
            out.push('<p class="leading-relaxed text-xs text-slate-700 dark:text-slate-300">' + formatInlineGuide(line) + '</p>');
        }

        flushList();
        flushTable();
        flushCallout();
        if (sectionOpen) {
            out.push('</div></details>');
        }

        return out.join('\n');
    };

    window._guideManualType = 'student';

    window.getGuideHtml = function(type) {
        const role = type || window._guideManualType || (typeof state !== 'undefined' && state && (state.currentRole || (state.currentUser && state.currentUser.role))) || 'student';
        if (window._parsedGuideCache[role]) {
            return window._parsedGuideCache[role];
        }
        let sourceId = 'guide-content-' + role;
        let source = document.getElementById(sourceId);
        if (!source) {
            if (role === 'developer') source = document.getElementById('guide-content-developer');
            else if (role === 'admin') source = document.getElementById('guide-content-admin') || document.getElementById('guide-content');
            else if (role === 'teacher') source = document.getElementById('guide-content-teacher');
            else if (role === 'student') source = document.getElementById('guide-content-student');
            else source = document.getElementById('guide-content');
        }
        const rawMd = source ? (source.value || source.textContent || source.innerText || '') : '';
        if (!rawMd) {
            return '<div class="p-8 text-center text-slate-400 text-xs">Guide content is currently unavailable.</div>';
        }
        const html = window.parseGuideMarkdownToHtml(rawMd);
        window._parsedGuideCache[role] = html;
        return html;
    };
